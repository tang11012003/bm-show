<script>
// 读取 URL 参数或 localStorage 中的考试信息
const urlParams = new URLSearchParams(window.location.search);
const urlType = urlParams.get('type');
const currentMode = urlParams.get('mode'); // 're_diagnose' | 'supplement' | null
const paramSubject = urlParams.get('subject');

const storedStep1 = JSON.parse(localStorage.getItem('uploadStep1') || 'null');
const step1 = storedStep1 || {
  examName: urlType === 'big' ? '期末考前综合冲刺模考' : '这边是日程标题 超出显示...',
  examDate: '2026-08-27',
  examType: urlType || 'big',
  note: '试卷综合复盘与学情诊断。'
};
if (urlType) {
  step1.examType = urlType;
}

// 9 大学科定义及 MasterGo 300:15797 精确渐变配置
const allSubjects = [
  { name: '语文', fullName: '语文学科', color: '#1FDCC0', grad: 'linear-gradient(170deg, #1FDCC0 0%, #17BEA5 100%)', bgLight: '#E6FAF6', icon: 'auto_stories' },
  { name: '数学', fullName: '数学学科', color: '#F36759', grad: 'linear-gradient(170deg, #F36759 0%, #E85041 100%)', bgLight: '#FEECEB', icon: 'calculate' },
  { name: '英语', fullName: '英语学科', color: '#FFC766', grad: 'linear-gradient(170deg, #FFC766 0%, #F5AB35 100%)', bgLight: '#FFF7E8', icon: 'translate' },
  { name: '物理', fullName: '物理学科', color: '#C48AFF', grad: 'linear-gradient(170deg, #C48AFF 0%, #A865F5 100%)', bgLight: '#F6EDFF', icon: 'lightbulb' },
  { name: '化学', fullName: '化学学科', color: '#37D4FF', grad: 'linear-gradient(170deg, #37D4FF 0%, #1EB5E8 100%)', bgLight: '#E8F9FF', icon: 'science' },
  { name: '生物', fullName: '生物学科', color: '#1FDCC0', grad: 'linear-gradient(170deg, #1FDCC0 0%, #17BEA5 100%)', bgLight: '#E6FAF6', icon: 'eco' },
  { name: '政治', fullName: '政治学科', color: '#F36759', grad: 'linear-gradient(170deg, #F36759 0%, #E85041 100%)', bgLight: '#FEECEB', icon: 'gavel' },
  { name: '历史', fullName: '历史学科', color: '#FFC766', grad: 'linear-gradient(170deg, #FFC766 0%, #F5AB35 100%)', bgLight: '#FFF7E8', icon: 'history_edu' },
  { name: '地理', fullName: '地理学科', color: '#C48AFF', grad: 'linear-gradient(170deg, #C48AFF 0%, #A865F5 100%)', bgLight: '#F6EDFF', icon: 'public' }
];

// 已有报告学科列表
const existingReportSubjects = JSON.parse(localStorage.getItem('reportSubjects') || '["语文", "数学", "英语"]');

// uploadData: { '_single': [url1, url2, ...] } 或 { '语文': [url1,...], '数学': [...] }
let uploadData = {};
let currentTarget = '_single';

// 初始化数据
if (step1.examType === 'small') {
  // 小考
  uploadData['_single'] = [
    generateMockPhoto('_single', 1),
    generateMockPhoto('_single', 2)
  ];
} else if (currentMode === 're_diagnose') {
  // 单科重新诊断模式：仅初始化指定科目
  const reSubj = paramSubject || '语文';
  currentTarget = reSubj;
  uploadData[reSubj] = [
    generateMockPhoto(reSubj, 1),
    generateMockPhoto(reSubj, 2)
  ];
} else if (currentMode === 'supplement') {
  // 补录模式：默认预置第一个未录入科目的 2 张模拟试卷
  const unUploadedList = allSubjects.filter(s => !existingReportSubjects.includes(s.name));
  const firstUnuploaded = unUploadedList[0] ? unUploadedList[0].name : '物理';
  currentTarget = firstUnuploaded;
  uploadData[firstUnuploaded] = [
    generateMockPhoto(firstUnuploaded, 1),
    generateMockPhoto(firstUnuploaded, 2)
  ];
} else {
  // 首次大考全科
  uploadData['语文'] = [generateMockPhoto('语文', 1), generateMockPhoto('语文', 2)];
  uploadData['数学'] = [generateMockPhoto('数学', 1), generateMockPhoto('数学', 2)];
}

function getTotalPhotos() {
  return Object.values(uploadData).reduce((sum, arr) => sum + arr.length, 0);
}

function getUploadedSubjectCount() {
  return allSubjects.filter(s => (uploadData[s.name] || []).length > 0).length;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function handleBack() {
  window.history.back();
}

function formatDateHeader(dateStr) {
  if (!dateStr) return '周四 08/27';
  const d = new Date(dateStr.replace(/-/g, '/'));
  const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const w = days[d.getDay()] || '周四';
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${w} ${m}/${day}`;
}

function renderSubjectCard(s, photos) {
  const isUploaded = photos.length > 0;
  const statusHtml = isUploaded
    ? `<span class="scu-status-tag uploaded">已上传 <strong class="scu-count-num">${photos.length}</strong></span>`
    : `<span class="scu-status-tag pending">待上传</span>`;

  let innerBoxHtml = '';
  if (isUploaded) {
    let thumbsHtml = '';
    photos.forEach((url, idx) => {
      thumbsHtml += `
        <div class="scu-thumb-square" onclick="openPreview('${url}')">
          <img src="${url}" class="scu-thumb-img" alt="${s.name}第${idx+1}页">
          <button class="scu-thumb-delete-btn" type="button" onclick="removePhoto('${s.name}', ${idx}); event.stopPropagation();">×</button>
        </div>
      `;
    });
    innerBoxHtml = `
      <div class="scu-thumbs-scroll-row">
        ${thumbsHtml}
        <div class="scu-add-square-btn" onclick="triggerUpload('${s.name}')" title="加页">
          <span class="material-icons scu-add-plus-icon">add</span>
        </div>
      </div>
    `;
  } else {
    innerBoxHtml = `
      <div class="scu-unuploaded-inner" onclick="triggerUpload('${s.name}')">
        <div class="scu-ub-left">
          <div class="scu-ub-illus">
            <svg width="42" height="36" viewBox="0 0 42 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="16" y="4" width="22" height="26" rx="3" fill="#D5F9F1" transform="rotate(12 27 17)"/>
              <rect x="9" y="3" width="22" height="26" rx="3" fill="#E6FAF6" transform="rotate(6 20 16)"/>
              <rect x="2" y="2" width="22" height="26" rx="3" fill="#FFFFFF" stroke="#00B383" stroke-width="1.2"/>
              <rect x="6" y="7" width="10" height="4" rx="2" fill="#00B383"/>
              <line x1="6" y1="15" x2="18" y2="15" stroke="#D8D8D8" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="6" y1="19" x2="16" y2="19" stroke="#D8D8D8" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="6" y1="23" x2="14" y2="23" stroke="#D8D8D8" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="scu-ub-hint">上传照片越清晰，识别更准确</span>
        </div>
        <button class="scu-ub-btn" type="button" onclick="triggerUpload('${s.name}'); event.stopPropagation();">
          <span class="material-icons" style="font-size:16px">photo_camera</span>
          <span>上传</span>
        </button>
      </div>
    `;
  }

  return `
    <div class="subject-card-unit">
      <div class="scu-header-row">
        <div class="scu-header-left">
          <div class="scu-icon-illus" style="background:${s.grad}">
            <span class="material-icons">${s.icon}</span>
          </div>
          <span class="scu-title-text">${s.fullName || s.name + '学科'}</span>
        </div>
        ${statusHtml}
      </div>
      <div class="scu-content-box">
        ${innerBoxHtml}
      </div>
    </div>
  `;
}

// 主渲染流程
function render() {
  const isSmall = step1.examType === 'small';
  const scrollContainer = document.getElementById('scrollContainer');
  const bottomEl = document.getElementById('bottomAction');

  if (isSmall) {
    scrollContainer.innerHTML = renderSmallMode();
  } else if (currentMode === 're_diagnose') {
    scrollContainer.innerHTML = renderReDiagnoseMode();
  } else if (currentMode === 'supplement') {
    scrollContainer.innerHTML = renderSupplementMode();
  } else {
    scrollContainer.innerHTML = renderBigMode();
  }

  // 渲染底部提交按钮 (MasterGo 300:15038 组 58714)
  const total = getTotalPhotos();
  const upSubjCount = getUploadedSubjectCount();

  if (total === 0) {
    let defaultText = '请先上传试卷照片';
    if (isSmall) defaultText = '请先上传试卷资料';
    else if (currentMode === 're_diagnose') defaultText = `请上传【${paramSubject || '语文'}】试卷`;
    else if (currentMode === 'supplement') defaultText = '请选择未上传科目拍照';

    bottomEl.innerHTML = `
      <button class="btn-submit-diag" disabled>${defaultText}</button>
      <div class="home-indicator-bar"></div>
    `;
  } else {
    let submitText = `确认提交（${upSubjCount}科 共${total}张）`;
    if (currentMode === 're_diagnose') {
      submitText = `确认重新提交【${paramSubject || '语文'}】（共${total}张）`;
    } else if (currentMode === 'supplement') {
      submitText = `确认提交补录（${upSubjCount}科 共${total}张）`;
    }

    bottomEl.innerHTML = `
      <button class="btn-submit-diag" onclick="doSubmit()">${submitText}</button>
      <div class="home-indicator-bar"></div>
    `;
  }
}

/* ──────────────────────────────────────────────────────────
   渲染大考首次全科模式 (MasterGo 300:15038)
   ────────────────────────────────────────────────────────── */
function renderBigMode() {
  const dateHeader = formatDateHeader(step1.examDate);
  const titleText = step1.examName || '期末模拟考试';

  let subjectCardsHtml = '';
  allSubjects.forEach(s => {
    const photos = uploadData[s.name] || [];
    subjectCardsHtml += renderSubjectCard(s, photos);
  });

  return `
    <div class="hero-header-row">
      <div class="title-group-box">
        <div class="hero-page-title">上传学科试卷</div>
        <div class="ai-pill-tag"><span class="ai-text">AI</span>解读</div>
        ${getTitleUnderlineSvg()}
      </div>
      ${getMascotSvg()}
    </div>

    <div class="memo-card-wrap">
      ${getPinSvg()}
      <div class="memo-top-row">
        <div class="memo-title-left">
          <span class="memo-quote-mark">“</span>
          <span>${titleText}</span>
          <span class="memo-quote-mark">”</span>
        </div>
        <div class="memo-date-badge">${dateHeader}</div>
      </div>
      <div class="memo-desc-text">
        小苗将识别本次大考的所有试卷/答题卡照片，帮您分析学生各学科的<strong>【学情状况】</strong>！
      </div>
    </div>

    <div class="subject-cards-list">
      ${subjectCardsHtml}
    </div>
  `;
}

/* ──────────────────────────────────────────────────────────
   渲染全科「补录科目」模式
   ────────────────────────────────────────────────────────── */
function renderSupplementMode() {
  const dateHeader = formatDateHeader(step1.examDate);
  const titleText = step1.examName || '期末考试周';
  const unUploadedSubjects = allSubjects.filter(s => !existingReportSubjects.includes(s.name));

  let subjectCardsHtml = '';
  unUploadedSubjects.forEach(s => {
    const photos = uploadData[s.name] || [];
    subjectCardsHtml += renderSubjectCard(s, photos);
  });

  return `
    <div class="hero-header-row">
      <div class="title-group-box">
        <div class="hero-page-title">补录学科试卷</div>
        <div class="ai-pill-tag"><span class="ai-text">AI</span>解读</div>
        ${getTitleUnderlineSvg()}
      </div>
      ${getMascotSvg()}
    </div>

    <div class="memo-card-wrap">
      ${getPinSvg()}
      <div class="memo-top-row">
        <div class="memo-title-left">
          <span class="memo-quote-mark">“</span>
          <span>${titleText} · 补录</span>
          <span class="memo-quote-mark">”</span>
        </div>
        <div class="memo-date-badge">${dateHeader}</div>
      </div>
      <div class="memo-desc-text">
        已完成诊断：<strong>${existingReportSubjects.join('、')}</strong>。<br>
        小苗将识别本次所有待补录试卷照片，帮您分析学生各学科的【学情状况】！
      </div>
    </div>

    <div class="subject-cards-list">
      ${subjectCardsHtml}
    </div>
  `;
}

/* ──────────────────────────────────────────────────────────
   渲染单科「重新诊断」模式
   ────────────────────────────────────────────────────────── */
function renderReDiagnoseMode() {
  const targetSubj = paramSubject || '语文';
  const sObj = allSubjects.find(s => s.name === targetSubj) || allSubjects[0];

function handleFileSelect(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;
  if (!uploadData[currentTarget]) uploadData[currentTarget] = [];
  for (let i = 0; i < files.length; i++) {
    const url = URL.createObjectURL(files[i]);
    uploadData[currentTarget].push(url);
  }
  e.target.value = '';
  render();
}

function removePhoto(key, index) {
  if (uploadData[key]) {

    if (uploadData[key].length === 0) delete uploadData[key];

  render();
}

let gradingInterval = null;

function handleBackHomeInBackground() {
  if (gradingInterval) clearInterval(gradingInterval);
  const examTitle = step1.examName || '期末考试周';
  // 记录后台批改任务到 localStorage
  const bgTask = {
    examName: examTitle,
    examDate: step1.examDate,
    examType: step1.examType,
    status: 'grading',
    startTime: Date.now()
  };
  localStorage.setItem('backgroundGradingTask', JSON.stringify(bgTask));
  showToast('已转入后台批改，完成后可在首页与日历查看报告');
  setTimeout(() => {
    window.location.href = 'fenxi.html';
  }, 400);
}


let currentPercent = 46;
let isGradingPaused = false;

function pauseGrading() {
  isGradingPaused = true;
  if (gradingInterval) {
    clearInterval(gradingInterval);
    gradingInterval = null;
  }
  const btn = document.getElementById('gradingPauseBtn');
  const icon = document.getElementById('gradingPauseIcon');
  const text = document.getElementById('gradingPauseText');
  if (btn) btn.classList.add('is-paused');
  if (icon) icon.textContent = 'play_arrow';
  if (text) text.textContent = '已暂停(点击继续)';
}

function resumeGrading() {
  isGradingPaused = false;
  const btn = document.getElementById('gradingPauseBtn');
  const icon = document.getElementById('gradingPauseIcon');
  const text = document.getElementById('gradingPauseText');
  if (btn) btn.classList.remove('is-paused');
  if (icon) icon.textContent = 'pause';
  if (text) text.textContent = '暂停演示';
  runGradingTimer();
}

function toggleGradingPause() {
  if (isGradingPaused) {
    resumeGrading();
  } else {
    pauseGrading();
  }
}

function openGradingSheetDemo(pause = true) {
  const overlay = document.getElementById('loadingSheetOverlay');
  const panel = document.getElementById('gradingSheetPanel');
  const bar = document.getElementById('gradingProgressBar');
  const percentText = document.getElementById('gradingPercentText');

  if (overlay) overlay.classList.add('show');
  if (panel) panel.classList.add('show');

  if (pause) {
    pauseGrading();
    currentPercent = 46;
    if (bar) bar.style.width = '46%';
    if (percentText) percentText.textContent = '46%';
  }
}

function runGradingTimer() {
  if (gradingInterval) clearInterval(gradingInterval);
  const bar = document.getElementById('gradingProgressBar');
  const percentText = document.getElementById('gradingPercentText');

  gradingInterval = setInterval(() => {
    if (isGradingPaused) {
      clearInterval(gradingInterval);
      return;
    }
    currentPercent += Math.floor(Math.random() * 10) + 5;
    if (currentPercent >= 100) {
      currentPercent = 100;
      if (bar) bar.style.width = '100%';
      if (percentText) percentText.textContent = '100%';
      clearInterval(gradingInterval);

      // 批改完成：进入确认错题页 (gouxuancuoti.html)
      setTimeout(() => {
        let targetUrl = 'gouxuancuoti.html?from=upload';
        if (step1.examType === 'small') targetUrl += '&type=small';
        if (currentMode) targetUrl += `&mode=${currentMode}`;
        if (paramSubject) targetUrl += `&subject=${encodeURIComponent(paramSubject)}`;
        if (step1.examName) targetUrl += `&exam=${encodeURIComponent(step1.examName)}`;
        if (typeof subjects !== 'undefined' && subjects && subjects.length > 0) targetUrl += `&subjects=${encodeURIComponent(subjects.join(','))}`;
        window.location.href = targetUrl;
      }, 400);
    } else {
      if (bar) bar.style.width = currentPercent + '%';
      if (percentText) percentText.textContent = currentPercent + '%';
    }
  }, 450);
}

function doSubmit() {
  if (getTotalPhotos() === 0) return;

  let subjects = [];
  if (step1.examType === 'small') {
    subjects = ['化学'];
  } else if (currentMode === 're_diagnose') {
    subjects = [paramSubject || '语文'];
  } else {
    subjects = Object.keys(uploadData).filter(k => (uploadData[k] || []).length > 0);
  }

  const uploadCtx = {
    examName: step1.examName,
    examType: step1.examType,
    examDate: step1.examDate,
    mode: currentMode || 'initial',
    subjects: subjects,
    totalPhotos: getTotalPhotos(),
    uploadedAt: Date.now()
  };
  localStorage.setItem('uploadContext', JSON.stringify(uploadCtx));

  if (currentMode === 'supplement') {
    localStorage.setItem('supplementNewSubjects', JSON.stringify(subjects));
  }

  // 唤起 MasterGo 300:19250 批改加载抽屉
  const overlay = document.getElementById('loadingSheetOverlay');
  const panel = document.getElementById('gradingSheetPanel');
  const bar = document.getElementById('gradingProgressBar');
  const percentText = document.getElementById('gradingPercentText');

  if (overlay) overlay.classList.add('show');
  if (panel) panel.classList.add('show');

  currentPercent = 18;
  if (bar) bar.style.width = currentPercent + '%';
  if (percentText) percentText.textContent = currentPercent + '%';
  resumeGrading();
}

// 页面初始化渲染
render();
</script>

  function getDesktopDocsWidth() {
    const val = getComputedStyle(document.documentElement).getPropertyValue("--protoMobile-docs-width").trim();
    if (val && val.endsWith("px")) {
      return Number.parseFloat(val);
    }
    return docsPanel ? Math.round(docsPanel.getBoundingClientRect().width) : 520;
  }

  function getDesktopDocsMaxWidth() {
    const reservedWidth = deviceWidth + 320 + 104;
    return Math.max(desktopDocsMinWidth, Math.min(desktopDocsHardMaxWidth, window.innerWidth - reservedWidth));
  }

  function setDesktopDocsWidth(requestedWidth, persist = false) {
    if (requestedWidth === "1fr" || requestedWidth === "auto" || !requestedWidth) {
      document.documentElement.style.setProperty("--protoMobile-docs-width", "1fr");
      docsSplitter?.removeAttribute("aria-valuenow");
      if (persist) {
        try { localStorage.setItem(docsWidthStorageKey, "1fr"); } catch (error) {}
      }
      return getDesktopDocsWidth();
    }
    const maximum = getDesktopDocsMaxWidth();
    const width = Math.round(Math.min(maximum, Math.max(desktopDocsMinWidth, Number(requestedWidth) || 520)));
    document.documentElement.style.setProperty("--protoMobile-docs-width", `${width}px`);
    docsSplitter?.setAttribute("aria-valuemin", String(desktopDocsMinWidth));
    docsSplitter?.setAttribute("aria-valuemax", String(maximum));
    docsSplitter?.setAttribute("aria-valuenow", String(width));
    if (persist) {
      try { localStorage.setItem(docsWidthStorageKey, `${width}px`); } catch (error) {}
    }
    return width;
  }

  function restoreDesktopDocsWidth() {
    let stored = "";
    try { stored = localStorage.getItem(docsWidthStorageKey); } catch (error) {}
    if (stored && stored !== "1fr") {
      setDesktopDocsWidth(stored, false);
    } else {
      setDesktopDocsWidth("1fr", false);
    }
  }

  function makeDesktopDocsResizable() {
    if (!docsSplitter) return;
    let dragState = null;
    docsSplitter.addEventListener("pointerdown", event => {
      if (event.button !== 0 || window.innerWidth < 1180) return;
      dragState = { pointerId: event.pointerId, startX: event.clientX, startWidth: getDesktopDocsWidth() };
      docsSplitter.setPointerCapture(event.pointerId);
      docsSplitter.classList.add("is-dragging");
      stage.classList.add("is-resizing");

      if (!dragState || event.pointerId !== dragState.pointerId) return;
      setDesktopDocsWidth(dragState.startWidth + event.clientX - dragState.startX, false);
      scheduleMarkerLayout();
    });

      if (!dragState || event.pointerId !== dragState.pointerId) return;
      dragState = null;
      docsSplitter.classList.remove("is-dragging");
      stage.classList.remove("is-resizing");
      setDesktopDocsWidth(getDesktopDocsWidth(), true);
      scheduleMarkerLayout();
      requestAnimationFrame(() => auditLayout(true));
    };
    docsSplitter.addEventListener("pointerup", endDrag);
    docsSplitter.addEventListener("pointercancel", endDrag);
    docsSplitter.addEventListener("keydown", event => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key) || window.innerWidth < 1180) return;

        ? desktopDocsMinWidth
        : event.key === "End"
          ? getDesktopDocsMaxWidth()
          : getDesktopDocsWidth() + (event.key === "ArrowRight" ? 24 : -24);
      setDesktopDocsWidth(next, true);
      scheduleMarkerLayout();
      event.preventDefault();
    });
  }

  function isVisible(element) {
    if (!element) return false;
    const style = getComputedStyle(element);
    if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) return false;
    if (element.hidden || element.getAttribute("aria-hidden") === "true") return false;
    const rect = element.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0;
  }

  function serializeRect(rect) {
    return {
      left: Math.round(rect.left),
      top: Math.round(rect.top),
      right: Math.round(rect.right),
      bottom: Math.round(rect.bottom),
      width: Math.round(rect.width),
      height: Math.round(rect.height)
    };
  }

  function inspectLayout() {
    const issues = [];
    const stageRect = stage.getBoundingClientRect();
    const deviceRect = device.getBoundingClientRect();
    const docsRect = docsPanel.getBoundingClientRect();
    const notesPanel = noteList.closest(".protoMobile-notes-panel");
    const notesRect = notesPanel?.getBoundingClientRect() || new DOMRect();
    const desktopWide = window.innerWidth >= 1180;
    if (stage.parentElement !== document.body) issues.push("STAGE_NOT_MOUNTED_TO_BODY");
    if (Math.abs(stageRect.left) > 2 || Math.abs(stageRect.top) > 2
      || Math.abs(stageRect.width - window.innerWidth) > 3
      || Math.abs(stageRect.height - window.innerHeight) > 3) issues.push("STAGE_NOT_VIEWPORT_SIZED");
    if (desktopWide) {
      const hasDocs = globalSections.length > 0;
      if ((hasDocs && !isVisible(docsPanel)) || !isVisible(device) || !isVisible(notesPanel)) issues.push("DESKTOP_COLUMNS_MISSING");
      if (Math.abs(deviceRect.width - deviceWidth) > 3) issues.push("DEVICE_WIDTH_INVALID");
      if ((hasDocs && docsRect.right > deviceRect.left + 1) || deviceRect.right > notesRect.left + 1) issues.push("DESKTOP_COLUMNS_OVERLAP");
      if (hasDocs && (docsRect.width < desktopDocsMinWidth - 2 || docsRect.width > getDesktopDocsMaxWidth() + 2)) issues.push("DOCS_WIDTH_OUT_OF_RANGE");
    } else if (isMobileViewport()) {
      if (Math.abs(deviceRect.width - window.innerWidth) > 3) issues.push("MOBILE_DEVICE_NOT_VIEWPORT_SIZED");
    }
    const markerOutsideDeviceIds = Array.from(markerLayer.querySelectorAll(".protoMobile-marker:not([hidden])"))
      .filter(marker => getComputedStyle(marker).display !== "none")
      .filter(marker => {
        const rect = marker.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        return x < deviceRect.left - 2 || x > deviceRect.right + 2 || y < deviceRect.top - 2 || y > deviceRect.bottom + 2;
      })
      .map(marker => marker.dataset.noteId);
    if (markerOutsideDeviceIds.length) issues.push("MARKERS_OUTSIDE_DEVICE");
    return {
      status: issues.length ? "fail" : "pass",
      issues,
      stageMountedToBody: stage.parentElement === document.body,
      docsWidthMaximum: getDesktopDocsMaxWidth(),
      markerOutsideDeviceIds,
      rects: {
        stage: serializeRect(stageRect),
        docs: serializeRect(docsRect),
        device: serializeRect(deviceRect),
        notes: serializeRect(notesRect)
      }
    };
  }

  function auditLayout(logFailure = false) {
    const report = inspectLayout();
    stage.dataset.protoMobileLayoutStatus = report.status;
    const signature = report.issues.join("|");
    if (logFailure && report.status === "fail" && signature !== lastLayoutIssueSignature) {
      console.error("移动端标注审阅框架布局检查未通过", report);
    }
    lastLayoutIssueSignature = signature;
    return report;

  function isOverlayContainerOpen(node) {
    if (!node || !node.isConnected) return false;
    const overlay = node.closest ? node.closest(
      ".sheet-panel, .bottom-sheet, .drawer, .drawer-panel, .modal, .modal-card, .dialog-modal, .grading-sheet-panel, [role='dialog'], [data-modal], [data-sheet]"
    ) : null;
    if (!overlay) return true;
    const cl = overlay.classList;
    if (cl.contains("show") || cl.contains("active") || cl.contains("is-open") || cl.contains("open") || cl.contains("visible")) {
      const style = window.getComputedStyle(overlay);
      if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) {
        return false;
      }
      return true;
    }
    return false;
  }

  function isTargetRenderable(target, scopeNode) {
    if (!target || !target.isConnected) return false;
    if (!isOverlayContainerOpen(target)) return false;
    let current = target;
    while (current && current.nodeType === 1) {
      const style = getComputedStyle(current);
      if (current.hidden || current.getAttribute("aria-hidden") === "true") return false;
      if (style.display === "none" || style.visibility === "hidden" || Number(style.opacity) === 0) return false;
      if (current === scopeNode || current === appRoot) break;
      current = current.parentElement;
    }
    const rect = target.getBoundingClientRect();
    return rect.width > 0 && rect.height > 0;
  }

  function isTargetUndersized(target) {
    const rect = target.getBoundingClientRect();
    return rect.width < 4 || rect.height < 4;

  function isPopoverOpen() {

      return overlayRoot.matches(":popover-open");
    } catch (error) {
      return false;
    }
  }

  function ensureOverlayLayer(reorder = false) {
    if (typeof overlayRoot.showPopover === "function" && typeof overlayRoot.hidePopover === "function") {
      try {
        if (reorder && isPopoverOpen()) overlayRoot.hidePopover();
        if (!isPopoverOpen()) overlayRoot.showPopover();
        overlayRoot.dataset.protoMobileLayerMode = "top-layer";
        overlayRoot.style.zIndex = String(rootMaxZIndex);
        return;
      } catch (error) {
        console.warn("移动端标注层进入 top layer 失败，已使用 z-index 兜底", error);

    overlayRoot.style.zIndex = String(rootMaxZIndex);
    overlayRoot.dataset.protoMobileLayerMode = "z-index";

  function scheduleLayerAudit() {
    window.clearTimeout(layerAuditTimer);
    layerAuditTimer = window.setTimeout(() => {
      ensureOverlayLayer(false);
      if (!isMobileViewport()) return;
      const rect = mobileLauncher.getBoundingClientRect();
      const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
      const clickable = Boolean(hit && (hit === mobileLauncher || mobileLauncher.contains(hit)));
      overlayRoot.dataset.protoMobileLauncherClickable = String(clickable);
      if (!clickable) {
        ensureOverlayLayer(true);
        requestAnimationFrame(() => {
          const nextHit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);

  function getScopeContext() {
    const candidates = Array.from(appRoot.querySelectorAll("[data-proto-scope]"));
    if (appRoot.matches("[data-proto-scope]")) candidates.unshift(appRoot);
    const visible = candidates
      .map((node, index) => ({ node, index, scope: node.dataset.protoScope, layer: Number(node.dataset.protoLayer) || 0 }))
      .filter(item => item.scope && isVisible(item.node));
    if (visible.length) {
      visible.sort((a, b) => a.layer - b.layer || a.index - b.index);
      return visible[visible.length - 1];
    }
    return { node: appRoot, scope: appRoot.dataset.protoScope || "page:default", layer: 0 };
  }

  function notesForScope(scope) {
    const acceptedScopes = new Set([scope, "page:*", "page:default", "page:fenxi"]);
    if (scope && scope.startsWith("page:")) {
      const parts = scope.split(":");
      if (parts.length >= 3) acceptedScopes.add(`${parts.slice(0, 2).join(":")}:*`);
      acceptedScopes.add("page:*");
      acceptedScopes.add("page:default");
      acceptedScopes.add("page:fenxi");
    }
    return annotations.filter(note => {
      if (!note.scope) return true;
      if (acceptedScopes.has(note.scope)) return true;
      if (note.scope.startsWith("page:") && (!scope || scope.startsWith("page:"))) return true;
      return false;
    });
  }

  function findTarget(note, scopeNode = getScopeContext().node) {
    try {
      if (scopeNode?.matches?.(note.target)) return scopeNode;
      return scopeNode?.querySelector?.(note.target) || appRoot.querySelector(note.target);
    } catch (error) {
      console.warn(`移动端标注 ${note.id || note.title || "未命名"} 的 target 无效`, error);
      return null;
    }
  }

  function resolveNotesForContext(context) {
    return notesForScope(context.scope);
  }

    function getClippedTargetRect(target) {
    if (!isVisible(target)) return null;
    const original = target.getBoundingClientRect();
    const deviceRect = device.getBoundingClientRect();
    let left = Math.max(original.left, deviceRect.left);
    let top = Math.max(original.top, deviceRect.top);
    let right = Math.min(original.right, deviceRect.right);
    let bottom = Math.min(original.bottom, deviceRect.bottom);
    let parent = target.parentElement;
    while (parent && parent !== appRoot.parentElement) {
      const style = getComputedStyle(parent);
      if (/(auto|scroll|hidden|clip)/.test(`${style.overflow}${style.overflowX}${style.overflowY}`)) {
        const rect = parent.getBoundingClientRect();
        left = Math.max(left, rect.left);
        top = Math.max(top, rect.top);
        right = Math.min(right, rect.right);
        bottom = Math.min(bottom, rect.bottom);
      }
      if (parent === appRoot) break;
      parent = parent.parentElement;
    }
    if (right <= left || bottom <= top) return null;
    return { original, visible: { left, top, right, bottom } };
  }

  function setActive(noteId) {
    activeNoteId = noteId;
    document.querySelectorAll(".protoMobile-marker, .protoMobile-note-card").forEach(element => {
      element.classList.toggle("is-active", element.dataset.noteId === noteId);
    });
  }

  function scheduleMarkerLayout() {
    if (layoutFrame) return;
    layoutFrame = requestAnimationFrame(() => {
      layoutFrame = 0;
      positionMarkers();
    });
  }

  function positionMarkers() {
    const deviceRect = device.getBoundingClientRect();
    const occupied = [];
    markerLayer.querySelectorAll(".protoMobile-marker").forEach(marker => {
      const note = currentNotes.find(item => item.id === marker.dataset.noteId);
      const target = note ? findTarget(note) : null;
      const clipped = target ? getClippedTargetRect(target) : null;
      if (!note || !clipped) {
        marker.hidden = true;
        return;
      }
      const anchorX = Number.isFinite(Number(note.x)) ? Math.min(1, Math.max(0, Number(note.x))) : 0.5;
      const anchorY = Number.isFinite(Number(note.y)) ? Math.min(1, Math.max(0, Number(note.y))) : 0.5;
      let left = clipped.original.left + clipped.original.width * anchorX;
      let top = clipped.original.top + clipped.original.height * anchorY;
      left = Math.max(clipped.visible.left, Math.min(clipped.visible.right, left));
      top = Math.max(clipped.visible.top, Math.min(clipped.visible.bottom, top));
      left = Math.max(deviceRect.left + 18, Math.min(deviceRect.right - 18, left));
      top = Math.max(deviceRect.top + 18, Math.min(deviceRect.bottom - 18, top));
      for (let attempt = 0; attempt < 5; attempt += 1) {
        if (!occupied.some(point => Math.hypot(point.left - left, point.top - top) < 36)) break;
        top = Math.min(deviceRect.bottom - 18, top + 36);
      }
      occupied.push({ left, top });
      marker.hidden = false;
      marker.style.left = `${left}px`;
      marker.style.top = `${top}px`;
    });
  }

  function renderMarkers() {
    markerLayer.replaceChildren();
    const shouldHide = isMobileViewport() ? !mobileEnabled : !desktopEnabled;
    const docsOpen = mobileDocsLayer.classList.contains("is-open") || docsPanel.classList.contains("is-compact-open");
    markerLayer.classList.toggle("is-hidden", shouldHide || docsOpen);
    currentNotes.forEach((note, index) => {
      const marker = document.createElement("button");
      marker.type = "button";
      marker.className = "protoMobile-marker";
      marker.dataset.noteId = note.id;
      marker.textContent = String(index + 1);
      marker.title = note.title;
      marker.setAttribute("aria-label", `标注 ${index + 1}：${note.title}`);
      marker.addEventListener("click", event => {
        event.stopPropagation();
        openNote(note);
      });
      markerLayer.appendChild(marker);
    });
    setActive(activeNoteId);
    scheduleMarkerLayout();
  }

  async function renderMermaidBlocks(root) {
    if (!window.mermaid) return;
    const blocks = Array.from(root.querySelectorAll("pre code.language-mermaid"));
    for (const block of blocks) {
      const pre = block.closest("pre");
      const container = document.createElement("div");
      container.className = "protoMobile-mermaid";
      try {
        const result = await window.mermaid.render(`protoMobile-mermaid-${++mermaidCounter}`, block.textContent.trim());
        container.innerHTML = result.svg;
        if (result.bindFunctions) result.bindFunctions(container);
        pre.replaceWith(container);
      } catch (error) {
        pre.classList.add("protoMobile-mermaid-error");
        console.error("移动端标注流程图渲染失败", error);
      }
    }
  }

  async function renderRichContent(root, item) {
    if (item.format === "html" || !window.marked) root.innerHTML = item.content || "";
    else root.innerHTML = window.marked.parse(item.content || "", { gfm: true, breaks: true });
    await renderMermaidBlocks(root);
  }

  
  function getNoteType(note) {
    if (note.type) return note.type;
    if (note.typeLabel?.includes('新')) return 'add';
    if (note.typeLabel?.includes('修')) return 'modify';
    if (note.typeLabel?.includes('删') || note.typeLabel?.includes('下')) return 'delete';
    if (note.typeLabel?.includes('原')) return 'original';
    return note.typeLabel ? 'custom' : 'original';
  }

  function renderFilterBar() {
    if (!filterBar) return;
    filterBar.replaceChildren();

    const counts = {
      all: currentNotes.length,
      add: 0,
      modify: 0,
      original: 0,
      delete: 0
    };

    currentNotes.forEach(note => {
      const type = getNoteType(note);
      if (counts[type] !== undefined) {
        counts[type] += 1;
      } else {
        counts.original += 1;
      }
    });

    const filterDefs = [
      { key: "all", label: "全部", count: counts.all, chipClass: "chip-all" },
      { key: "original", label: "⚪ 原有", count: counts.original, chipClass: "chip-original" },
      { key: "add", label: "🟢 新增", count: counts.add, chipClass: "chip-add" },
      { key: "modify", label: "🟡 修改", count: counts.modify, chipClass: "chip-modify" }
    ];

    if (counts.delete > 0) {
      filterDefs.push({ key: "delete", label: "🔴 下线", count: counts.delete, chipClass: "chip-delete" });
    }

    filterDefs.forEach(def => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = `protoMobile-filter-chip ${def.chipClass}${activeFilter === def.key ? " is-active" : ""}`;
      chip.innerHTML = `<span>${def.label}</span><span class="protoMobile-filter-count">${def.count}</span>`;
      chip.addEventListener("click", () => {
        if (activeFilter === def.key) {
          activeFilter = "all";
        } else {
          activeFilter = def.key;
        }
        renderFilterBar();
        renderNoteList();
      });
      filterBar.appendChild(chip);
    });

  function renderNoteList() {
    renderFilterBar();
    noteList.replaceChildren();
    if (!currentNotes.length) {
      noteList.innerHTML = '<div class="protoMobile-empty">当前页面暂无标注</div>';
      return;
    }
    const visibleNotes = activeFilter === "all"
      ? currentNotes
      : currentNotes.filter(note => getNoteType(note) === activeFilter);

    if (!visibleNotes.length) {
      noteList.innerHTML = '<div class="protoMobile-empty">暂无该分类的标注</div>';
      return;
    }
    visibleNotes.forEach((note, index) => {
      const globalIndex = currentNotes.indexOf(note);
      const displayIndex = globalIndex >= 0 ? globalIndex + 1 : index + 1;
      const card = document.createElement("article");
      const noteType = note.type || (note.typeLabel?.includes('新') ? 'add' : (note.typeLabel?.includes('修') ? 'modify' : (note.typeLabel?.includes('删') || note.typeLabel?.includes('下') ? 'delete' : (note.typeLabel?.includes('原') ? 'original' : (note.typeLabel ? 'custom' : 'original')))));
      const typeLabel = note.typeLabel || note.badge || (noteType === 'add' ? '新增' : (noteType === 'modify' ? '修改' : (noteType === 'delete' ? '下线' : (noteType === 'original' ? '原有' : '说明'))));
      const tagClass = noteType === 'add' ? 'tag-add' : (noteType === 'modify' ? 'tag-modify' : (noteType === 'delete' ? 'tag-delete' : (noteType === 'original' ? 'tag-original' : 'tag-custom')));
      const cardClass = noteType === 'add' ? 'card-add' : (noteType === 'modify' ? 'card-modify' : (noteType === 'delete' ? 'card-delete' : (noteType === 'original' ? 'card-original' : 'card-custom')));

      card.className = `protoMobile-note-card ${cardClass}`;
      card.dataset.noteId = note.id;
      card.tabIndex = 0;

      heading.textContent = note.title;

      headerRow.append(tagEl, heading);

      const body = document.createElement("div");
      copy.append(headerRow, body);
      card.append(number, copy);

      const locate = () => locateTarget(note);
      card.addEventListener("click", locate);
      card.addEventListener("keydown", event => {

  function highlightTarget(target) {
    document.querySelectorAll(".protoMobile-target-highlight").forEach(element => element.classList.remove("protoMobile-target-highlight"));
    target.classList.add("protoMobile-target-highlight");
    window.setTimeout(() => target.classList.remove("protoMobile-target-highlight"), 1100);

  function matchesApprovedScrollContainer(element) {
    return approvedScrollSelectors.some(selector => {
      try {
        return element.matches(selector);
      } catch (error) {
        console.warn(`移动端标注滚动容器选择器无效：${selector}`, error);
        return false;
      }
    });
  }

  function findScrollParent(target) {
    let parent = target.parentElement;
    while (parent && parent !== document.body && parent !== device && parent !== stage) {
      const style = getComputedStyle(parent);
      if (matchesApprovedScrollContainer(parent)
        && /(auto|scroll)/.test(style.overflowY)
        && parent.scrollHeight > parent.clientHeight + 1) return parent;
      if (parent === appRoot) break;
      parent = parent.parentElement;
    }
    return null;
  }

  function isFullyVisibleInDevice(target, scroller = null) {
    const targetRect = target.getBoundingClientRect();
    const deviceRect = device.getBoundingClientRect();
    const scrollRect = scroller ? scroller.getBoundingClientRect() : deviceRect;
    const viewport = {
      left: Math.max(deviceRect.left, scrollRect.left),
      top: Math.max(deviceRect.top, scrollRect.top),
      right: Math.min(deviceRect.right, scrollRect.right),
      bottom: Math.min(deviceRect.bottom, scrollRect.bottom)
    };
    return targetRect.left >= viewport.left - 1
      && targetRect.top >= viewport.top - 1
      && targetRect.right <= viewport.right + 1
      && targetRect.bottom <= viewport.bottom + 1;
  }

  function trackScrollUntilSettled(scroller, target) {
    let last = scroller.scrollTop;
    let stableFrames = 0;
    let frameCount = 0;
    function track() {
      scheduleMarkerLayout();
      const current = scroller.scrollTop;
      stableFrames = Math.abs(current - last) < 0.5 ? stableFrames + 1 : 0;
      last = current;
      frameCount += 1;
      if (stableFrames >= 3 || frameCount > 90) {
        highlightTarget(target);
        scheduleMarkerLayout();
        return;
      }
      requestAnimationFrame(track);
    }
    requestAnimationFrame(track);
  }

    function tryOpenOverlayForNote(note) {

    const isRenderableFn = typeof isRenderable === "function" ? isRenderable : (typeof isTargetRenderable === "function" ? isTargetRenderable : null);
    const isOverlayOpenFn = typeof isOverlayContainerOpen === "function" ? isOverlayContainerOpen : () => true;

      const confirmBtn = document.querySelector("#eventDetailModal .sheet-btn-confirm, .sheet-card .sheet-btn-confirm");
      if (confirmBtn) {
        confirmBtn.click();
        return true;
      }
      const eventItem = document.querySelector(".day-event-item, [onclick*='showEventDetail'], [onclick*='openEditEventModal']");
      if (eventItem) {
        eventItem.click();
        setTimeout(() => {
          const editBtn = document.querySelector("#eventDetailModal .sheet-btn-confirm");
          if (editBtn) editBtn.click();
        }, 60);
        return true;
      }
    }

    // 3. 新建 / 添加日程专属抽屉及弹窗
    const isAdd = targetSelector.includes("addEvent") || targetSelector.includes("AddSchedule")
      || title.includes("新建") || title.includes("添加") || title.includes("创建");

    if (isAdd) {
      if (typeof window.closeAllModals === "function") window.closeAllModals();
      if (typeof window.closeAllSheets === "function") window.closeAllSheets();

      if (typeof window.openAddScheduleSheet === "function") {
        try {
          window.openAddScheduleSheet();
          return true;
        } catch(e) {}
      }
      if (typeof window.openAddEventModal === "function") {
        try {
          window.openAddEventModal();
          return true;
        } catch(e) {}
      }
      const addBtn = root.querySelector("#addEventBtn, .add-event-btn, [onclick*='openAddEventModal'], [onclick*='openAddScheduleSheet'], .esc-add-btn");
      if (addBtn) {
        addBtn.click();
        return true;
      }
    }

    // 4. 切换日程专属抽屉
    const isSelectSchedule = targetSelector.includes("scheduleSelect") || title.includes("选择日程") || title.includes("切换日程");
    if (isSelectSchedule) {
      if (typeof window.closeAllSheets === "function") window.closeAllSheets();
      if (typeof window.openScheduleSelectSheet === "function") {
        try {
          window.openScheduleSelectSheet();
          return true;
        } catch(e) {}
      }
    }

    // 5. 通用弹窗 / 抽屉 / 底部面板触发器寻找
    const idMatch = targetSelector.match(/#([a-zA-Z0-9_-]+)/);
    const classMatches = Array.from(targetSelector.matchAll(/\.([a-zA-Z0-9_-]+)/g)).map(m => m[1]);
    const candidates = [];
    if (idMatch) candidates.push(idMatch[1]);
    candidates.push(...classMatches);

    for (const cand of candidates) {
      const capitalized = cand.charAt(0).toUpperCase() + cand.slice(1);
      const fnNames = [`open${capitalized}`, `show${capitalized}`, `open${capitalized}Modal`, `show${capitalized}Modal`, `open${capitalized}Sheet`];
      for (const fn of fnNames) {
        if (typeof window[fn] === "function") {
          try {
            window[fn]();
            return true;
          } catch(e) {}
        }
      }
      const trigger = root.querySelector(`[data-target="#${cand}"], [data-target="${cand}"], [data-modal="${cand}"], [data-sheet="${cand}"], [aria-controls="${cand}"], [href="#${cand}"]`);
      if (trigger) {
        trigger.click();
        return true;
      }
    }

    // 7. 批改加载中抽屉 (shangchuanfupan.html: gradingSheetPanel)
    const isGrading = targetSelector.includes("grading") || targetSelector.includes("gsp-")
      || title.includes("批改") || title.includes("解析中") || title.includes("进度条");
    if (isGrading) {
      if (typeof window.openGradingSheetDemo === "function") {
        try {
          window.openGradingSheetDemo(true);
          return true;
        } catch(e) {}

      const panel = document.getElementById("gradingSheetPanel");
      const overlay = document.getElementById("loadingSheetOverlay");
      if (panel) {
        panel.classList.add("show");
        if (overlay) overlay.classList.add("show");
        if (typeof window.pauseGrading === "function") window.pauseGrading();
        return true;
      }
    }

    // 6. 关键字按钮匹配 (排除通用词)
    const stopWords = new Set(["日程", "页面", "说明", "业务", "功能", "模块", "弹窗", "面板"]);
    const keywords = title.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, " ").trim().split(/\s+/).filter(w => w.length >= 2 && !stopWords.has(w));
    for (const kw of keywords) {
      const btn = Array.from(root.querySelectorAll("button, a, .btn, [role='button']")).find(el => el.textContent?.trim().includes(kw) && !el.closest("#prototypeAnnotationRoot, .protoMobile-stage, .proto-editor-overlay"));
      if (btn) {
        btn.click();
        return true;
      }
    }

    return false;
  }

  function doLocateTarget(note, target) {
    setActive(note.id);
    if (note.scroll === false || target.closest('[data-proto-scroll="none"]')) {
      highlightTarget(target);
      scheduleMarkerLayout();
      return;
    }
    const scroller = findScrollParent(target);
    if (!scroller || isFullyVisibleInDevice(target, scroller)) {
      highlightTarget(target);
      scheduleMarkerLayout();
      return;
    }
    const scrollRect = scroller.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    const targetTop = targetRect.top - scrollRect.top + scroller.scrollTop;
    const maxScrollTop = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
    const desiredTop = Math.min(maxScrollTop, Math.max(0, targetTop - (scroller.clientHeight - targetRect.height) / 2));
    if (Math.abs(desiredTop - scroller.scrollTop) < 0.5) {
      highlightTarget(target);
      scheduleMarkerLayout();
      return;
    }
    scroller.scrollTo({ top: desiredTop, behavior: "smooth" });
    trackScrollUntilSettled(scroller, target);
  }

  function locateTarget(note) {
    let target = findTarget(note);
    const isOverlayOpenFn = typeof isOverlayContainerOpen === "function" ? isOverlayContainerOpen : () => true;
    if (!target || !isTargetRenderable(target) || !isOverlayOpenFn(target)) {
      if (tryOpenOverlayForNote(note)) {
        setTimeout(() => {
          syncContext();
          renderMarkers();
          const nextTarget = findTarget(note);
          if (nextTarget && isTargetRenderable(nextTarget)) {
            doLocateTarget(note, nextTarget);
          }
        }, 150);
        return;
      }
    }
    if (!target) return;
    doLocateTarget(note, target);
  }

  function inspectCompactDocsLayer() {
    const open = docsPanel.classList.contains("is-compact-open");
    if (!open) return { status: "closed", open: false };
    const rect = docsPanel.getBoundingClientRect();
    const sampleX = Math.max(rect.left + 1, Math.min(rect.right - 1, rect.left + Math.min(80, rect.width / 2)));
    const sampleY = Math.max(rect.top + 1, Math.min(rect.bottom - 1, rect.top + Math.min(32, rect.height / 2)));
    const hit = document.elementFromPoint(sampleX, sampleY);
    const issues = [];
    if (docsPanel.parentElement !== overlayRoot) issues.push("DOCS_NOT_IN_OVERLAY_ROOT");
    if (!compactBackdrop.classList.contains("is-open")) issues.push("COMPACT_BACKDROP_NOT_OPEN");
    if (!isVisible(docsPanel)) issues.push("COMPACT_DOCS_NOT_VISIBLE");
    if (!(hit && (hit === docsPanel || docsPanel.contains(hit)))) issues.push("COMPACT_DOCS_NOT_CLICKABLE");
    if (!markerLayer.classList.contains("is-hidden")) issues.push("MARKERS_VISIBLE_BEHIND_DOCS");
    return {
      status: issues.length ? "fail" : "pass",
      open: true,
      issues,
      mountedToOverlayRoot: docsPanel.parentElement === overlayRoot,
      markersHidden: markerLayer.classList.contains("is-hidden"),
      hitInsidePanel: Boolean(hit && (hit === docsPanel || docsPanel.contains(hit))),
      rect: serializeRect(rect)
    };
  }

window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'PRD_PAGES_UPDATED' && Array.isArray(e.data.pages)) {
    window.__PRD_PAGES_REGISTRY__ = e.data.pages;
    try { localStorage.setItem('PRD_PAGES_REGISTRY_UNIFIED', JSON.stringify(e.data.pages)); } catch(err) {}

});

function doProtoNavigate(targetUrl, e) {
  if (!targetUrl || targetUrl.startsWith('#') || targetUrl.startsWith('javascript:') || targetUrl.startsWith('tel:') || targetUrl.startsWith('mailto:')) {
    return true;
  }
  const targetFile = targetUrl.split(/[?#]/)[0].split('/').pop();
  if (!targetFile || !targetFile.endsWith('.html')) return true;

  const hasParent = window.parent && window.parent !== window;

  // 1. 获取工作台页面注册表（优先级：当前窗口全局注册表 -> window.parent -> 本地缓存）
  let pagesList = window.__PRD_PAGES_REGISTRY__ || null;
  if (!pagesList && hasParent) {
    try {
      if (window.parent.__PRD_PAGES_REGISTRY__) {
        pagesList = window.parent.__PRD_PAGES_REGISTRY__;
      } else if (window.parent.projectInfo && window.parent.projectInfo.pages) {
        pagesList = window.parent.projectInfo.pages;
      } else if (window.parent.pageList) {
        pagesList = window.parent.pageList;
      }
    } catch (err) {}
  }

  if (!pagesList) {
    try {
      const raw = localStorage.getItem('PRD_PAGES_REGISTRY_UNIFIED') || localStorage.getItem('PRD_HUB_PAGES_V2');
      if (raw) pagesList = JSON.parse(raw);
    } catch (err) {}
  }

  if (Array.isArray(pagesList) && pagesList.length > 0) {
    const matched = pagesList.find(p => p.path === targetFile || p.id === targetFile.replace(/\.html$/i, ''));
    if (matched) {
      // 1. 如果在【页面管理】中未勾选该页面：彻底阻止跳转（无反应）+ 弹提示
      if (matched.visible === false) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
        const msg = `⚠️ 页面「${matched.name || targetFile}」未在「页面管理」中勾选，暂不开放跳转`;
        if (hasParent) {
          try {
            window.parent.postMessage({ type: 'GUARD_BLOCKED', file: targetFile, name: matched.name }, '*');
          } catch (err) {}
          try {
            if (typeof window.parent.showFloatToast === 'function') window.parent.showFloatToast(msg);
            else if (typeof window.parent.showHubToast === 'function') window.parent.showHubToast(msg);
          } catch(err) {}
        }
        let toastEl = document.getElementById('proto-inner-guard-toast');
        if (!toastEl) {
          toastEl = document.createElement('div');
          toastEl.id = 'proto-inner-guard-toast';
          toastEl.style.cssText = 'position:fixed;top:30px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,0.92);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:999999;box-shadow:0 4px 16px rgba(0,0,0,0.3);';
          document.body.appendChild(toastEl);
        }
        toastEl.textContent = msg;
        toastEl.style.display = 'block';
        setTimeout(() => { if (toastEl) toastEl.style.display = 'none'; }, 2400);
        return false;
      }

      // 2. 如果在【页面管理】中已勾选：真正通知宿主工作台切换到该页面！
      if (hasParent) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
        }
        try {
          window.parent.postMessage({ type: 'SWITCH_PAGE', pageId: matched.id, path: matched.path }, '*');
        } catch (err) {}
        try {
          if (typeof window.parent.switchPage === 'function') {
            window.parent.switchPage(matched.id || matched.path);
          }
        } catch(err) {}
        return false;
      }
    }
  }

  if (hasParent) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
    }
    try {
      window.parent.postMessage({ type: 'SWITCH_PAGE', path: targetFile }, '*');
    } catch (err) {}
    return false;
  }

  // 独立单文件直接打开时的降级
  window.location.href = targetUrl;
  return false;
}

// 捕获阶段拦截所有链接和点击跳转
document.addEventListener('click', function(e) {
  const link = e.target.closest('a');
  if (link) {
    const href = link.getAttribute('href');
    if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
      const targetFile = href.split(/[?#]/)[0].split('/').pop();
      if (targetFile && targetFile.endsWith('.html')) {
        const res = doProtoNavigate(href, e);
        if (res === false) return;
      }
    }
  }

  const clickEl = e.target.closest('[onclick]');
  if (clickEl) {
    const onclickStr = clickEl.getAttribute('onclick') || '';
    const match = onclickStr.match(/(?:window\.)?location(?:\.href)?\s*=\s*['"`]([^'"`]+)['"`]/) 
      || onclickStr.match(/safeProtoNavigate\(['"`]([^'"`]+)['"`]\)/)
      || onclickStr.match(/goToAllSchedule\(\)/);
    
    if (match) {
      let href = match[1];
      if (onclickStr.includes('goToAllSchedule')) href = 'quanburicheng.html';
      if (href) {
        const targetFile = href.split(/[?#]/)[0].split('/').pop();
        if (targetFile && targetFile.endsWith('.html')) {
          const res = doProtoNavigate(href, e);
          if (res === false) return;
        }
      }
    }
  }

  const syncModal = document.getElementById("protoMobileDocSyncModal");
  const syncBtn = document.getElementById("protoMobileDocSyncBtn");

  const globalSyncToggle = document.getElementById("protoMobileGlobalSyncToggle");
  const tabBtnImport = document.getElementById("protoMobileTabBtnImport");

  const editTextarea = document.getElementById("protoMobileEditTextarea");

  const syncToast = document.getElementById("protoMobileSyncToast");

  const STORAGE_KEY_UNIFIED_ACTIVE = "PROTO_GLOBAL_UNIFIED_DOCS_ACTIVE";
  const STORAGE_KEY_UNIFIED_DATA = "PROTO_GLOBAL_UNIFIED_DOCS_DATA";

  function applyUnifiedDocsIfActive() {
    const isGlobalActive = localStorage.getItem(STORAGE_KEY_UNIFIED_ACTIVE) === "true";
    if (isGlobalActive) {
      const raw = localStorage.getItem(STORAGE_KEY_UNIFIED_DATA);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) {
            globalSections.splice(0, globalSections.length, ...parsed);
          }
        } catch(e) {}
      }
    }
  }

  function showToast(msg, duration = 2500) {
    if (!syncToast) return;
    syncToast.textContent = msg;
    syncToast.hidden = false;
    setTimeout(() => {
      syncToast.hidden = true;
    }, duration);
  }

  function initSyncFeature() {
    if (!syncBtn || !syncModal) return;

    const isGlobalActive = localStorage.getItem(STORAGE_KEY_UNIFIED_ACTIVE) === "true";
    if (globalSyncToggle) {
      globalSyncToggle.checked = isGlobalActive;
      globalSyncToggle.addEventListener("change", () => {
        const checked = globalSyncToggle.checked;
        localStorage.setItem(STORAGE_KEY_UNIFIED_ACTIVE, checked ? "true" : "false");
        if (checked) {
          localStorage.setItem(STORAGE_KEY_UNIFIED_DATA, JSON.stringify(globalSections));
          showToast("✅ 已开启全局统一说明，项目内切换页面将自动保持一致！");
        } else {
          showToast("ℹ️ 已关闭全局统一，各页面恢复独立说明。");
        }
      });
    }

    const ratioEqualBtn = document.getElementById("protoMobileRatioEqualBtn");
    const ratioDocBtn = document.getElementById("protoMobileRatioDocBtn");
    const ratioCompactBtn = document.getElementById("protoMobileRatioCompactBtn");

    if (ratioEqualBtn) {
      ratioEqualBtn.addEventListener("click", () => {
        setDesktopDocsWidth("1fr", true);
        scheduleMarkerLayout();
        showToast("⚖️ 已将所有页面三栏设为 1:1 左右均衡对称比例！");
      });
    }
    if (ratioDocBtn) {
      ratioDocBtn.addEventListener("click", () => {
        setDesktopDocsWidth(560, true);
        scheduleMarkerLayout();
        showToast("📖 已将所有页面三栏设为文档加宽比例 (560px)！");
      });
    }
    if (ratioCompactBtn) {
      ratioCompactBtn.addEventListener("click", () => {
        setDesktopDocsWidth(480, true);
        scheduleMarkerLayout();
        showToast("📌 已将所有页面三栏设为紧凑适中比例 (480px)！");
      });
    }

    function openSyncModal() {
      syncModal.hidden = false;
      switchSyncTab("import");
      populateSourceSelect();
      populateBatchChecklist();
      loadEditText();
    }
    function closeSyncModal() {
      syncModal.hidden = true;
    }

    syncBtn.addEventListener("click", openSyncModal);
    if (syncCloseBtn) syncCloseBtn.addEventListener("click", closeSyncModal);
    if (syncCloseFooterBtn) syncCloseFooterBtn.addEventListener("click", closeSyncModal);
    if (syncBackdrop) syncBackdrop.addEventListener("click", closeSyncModal);

    function switchSyncTab(tabName) {
      [tabBtnImport, tabBtnBatch, tabBtnEdit].forEach(btn => btn && btn.classList.remove("is-active"));
      [paneImport, paneBatch, paneEdit].forEach(p => p && p.classList.remove("is-active"));

      if (tabName === "import" && tabBtnImport && paneImport) {
        tabBtnImport.classList.add("is-active");
        paneImport.classList.add("is-active");
      } else if (tabName === "batch" && tabBtnBatch && paneBatch) {
        tabBtnBatch.classList.add("is-active");
        paneBatch.classList.add("is-active");
      } else if (tabName === "edit" && tabBtnEdit && paneEdit) {
        tabBtnEdit.classList.add("is-active");
        paneEdit.classList.add("is-active");
        loadEditText();
      }
    }

    if (tabBtnImport) tabBtnImport.addEventListener("click", () => switchSyncTab("import"));
    if (tabBtnBatch) tabBtnBatch.addEventListener("click", () => switchSyncTab("batch"));
    if (tabBtnEdit) tabBtnEdit.addEventListener("click", () => switchSyncTab("edit"));

    let cachedSourceDocs = {};

    function populateSourceSelect() {
      if (!sourceSelect) return;
      sourceSelect.innerHTML = "";
      const currentPath = window.location.pathname.split("/").pop() || "";
      
      PROJECT_PAGE_REGISTRY.forEach(pg => {
        const opt = document.createElement("option");
        opt.value = pg.file;
        opt.textContent = `${pg.title} (${pg.file})${pg.file === currentPath ? " [当前页]" : ""}`;
        if (pg.file === currentPath) opt.disabled = true;
        sourceSelect.appendChild(opt);
      });

      const validOpt = Array.from(sourceSelect.options).find(o => !o.disabled);
      if (validOpt) {
        sourceSelect.value = validOpt.value;
        loadSourcePreview(validOpt.value);
      }

      sourceSelect.onchange = () => {
        loadSourcePreview(sourceSelect.value);
      };
    }

    async function loadSourcePreview(filename) {
      if (!previewContent) return;
      previewContent.textContent = "正在读取 " + filename + " 的原型说明...";

      if (cachedSourceDocs[filename]) {
        renderPreviewData(cachedSourceDocs[filename]);
        return;
      }

      try {
        const res = await fetch(filename);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const html = await res.text();
        const m = html.match(/<script id="prototypeAnnotationData"[^>]*>([\s\S]*?)<\/script>/);
        if (m) {
          const parsed = JSON.parse(m[1]);
          const secs = parsed.globalSections || [];
          cachedSourceDocs[filename] = secs;
          renderPreviewData(secs);
        } else {
          previewContent.textContent = "⚠️ 该页面未找到原型说明数据。";
        }
      } catch (err) {
        const cached = localStorage.getItem("PROTO_DOCS_" + filename);
        if (cached) {
          try {
            const secs = JSON.parse(cached);
            cachedSourceDocs[filename] = secs;
            renderPreviewData(secs);
            return;
          } catch(e) {}
        }
        previewContent.innerHTML = `<div style="color:#b45309">⚠️ 本地直接打开时受浏览器同源限制无法动态 fetch 其他文件。<br>提示：在各页面内点击“设为全局统一说明”可通过本地缓存实现无缝跨页同步。</div>`;
      }
    }

    function renderPreviewData(sections) {
      if (!previewContent) return;
      if (!sections || !sections.length) {
        previewContent.textContent = "（该页面暂无原型说明内容）";
        return;
      }
      let html = `<div style="margin-bottom:8px"><strong>包含 ${sections.length} 个说明章节：</strong></div>`;
      sections.forEach((s, idx) => {
        const previewTxt = (s.content || "").replace(/<[^>]+>/g, "").slice(0, 120);
        html += `<div style="padding:6px 8px;margin-bottom:6px;background:#fff;border-radius:4px;border:1px solid #e2e8f0">
          <div style="font-weight:600;color:#0f172a">${idx + 1}. ${s.title || "未命名章节"}</div>
          <div style="color:#64748b;font-size:11.5px;margin-top:2px">${previewTxt}${previewTxt.length >= 120 ? "..." : ""}</div>
        </div>`;
      });
      previewContent.innerHTML = html;
    }

    function notifySectionsUpdated(newSections, targetFiles = null) {
      window.dispatchEvent(new CustomEvent("prototype-annotation:update-sections", {
        detail: { sections: newSections }
      }));
      if (window.__protoEditorEditor && typeof window.__protoEditorEditor.updateSections === "function") {
        window.__protoEditorEditor.updateSections(newSections);
      }

      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'SYNC_SESSION_DRAFT',
          session: {
            workingGlobalSections: newSections.map(s => ({ ...s, _editState: 'modified' }))
          }
        }, '*');
        if (window.parent.__protoEditorEditor && typeof window.parent.__protoEditorEditor.updateSections === "function") {
          window.parent.__protoEditorEditor.updateSections(newSections);
        }
      }

      const currentFile = window.location.pathname.split("/").pop() || "index.html";
      const filesToUpdate = targetFiles || [currentFile];
      fetch('/api/page/update-sections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          files: filesToUpdate,
          sections: newSections
        })
      }).then(r => r.json()).catch(() => {});
    }

    if (doCopyBtn) {
      doCopyBtn.addEventListener("click", () => {
        const selectedFile = sourceSelect ? sourceSelect.value : "";
        const sections = cachedSourceDocs[selectedFile];
        if (!sections || !sections.length) {
          showToast("⚠️ 未获取到有效说明内容，无法复制");
          return;
        }

        globalSections.splice(0, globalSections.length, ...JSON.parse(JSON.stringify(sections)));
        renderGlobalDocs().then(() => {
          syncContext();
        });

        if (globalSyncToggle && globalSyncToggle.checked) {
          localStorage.setItem(STORAGE_KEY_UNIFIED_DATA, JSON.stringify(globalSections));
        }

        notifySectionsUpdated(globalSections);

        showToast(`✅ 已成功将 ${selectedFile} 的原型说明复制并写入当前文件！`);
      });
    }

    function populateBatchChecklist() {
      if (!batchChecklist) return;
      batchChecklist.innerHTML = "";
      const currentPath = window.location.pathname.split("/").pop() || "";

      PROJECT_PAGE_REGISTRY.forEach(pg => {
        const label = document.createElement("label");
        label.className = `protoMobile-sync-check-item ${pg.file === currentPath ? "is-self" : ""}`;
        
        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.value = pg.file;
        chk.checked = (pg.file !== currentPath);
        chk.disabled = (pg.file === currentPath);
        chk.addEventListener("change", updateBatchCount);

        const span = document.createElement("span");
        span.textContent = `${pg.title} (${pg.file})${pg.file === currentPath ? " [当前页]" : ""}`;

        label.append(chk, span);
        batchChecklist.appendChild(label);
      });
      updateBatchCount();
    }

    function updateBatchCount() {
      if (!batchChecklist || !batchCountText) return;
      const checkedBoxes = batchChecklist.querySelectorAll('input[type="checkbox"]:checked:not(:disabled)');
      batchCountText.textContent = `已勾选 ${checkedBoxes.length} 个页面`;
    }

    if (selectAllBtn) {
      selectAllBtn.addEventListener("click", () => {
        if (!batchChecklist) return;
        batchChecklist.querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(c => c.checked = true);
        updateBatchCount();
      });
    }
    if (deselectAllBtn) {
      deselectAllBtn.addEventListener("click", () => {
        if (!batchChecklist) return;
        batchChecklist.querySelectorAll('input[type="checkbox"]:not(:disabled)').forEach(c => c.checked = false);
        updateBatchCount();
      });
    }

    if (doBatchSyncBtn) {
      doBatchSyncBtn.addEventListener("click", () => {
        if (!batchChecklist) return;
        const checkedBoxes = Array.from(batchChecklist.querySelectorAll('input[type="checkbox"]:checked:not(:disabled)'));
        if (!checkedBoxes.length) {
          showToast("⚠️ 请至少勾选一个目标页面");
          return;
        }

        const dataStr = JSON.stringify(globalSections);
        checkedBoxes.forEach(chk => {
          localStorage.setItem("PROTO_DOCS_" + chk.value, dataStr);
        });

        localStorage.setItem(STORAGE_KEY_UNIFIED_DATA, dataStr);
        if (globalSyncToggle) {
          globalSyncToggle.checked = true;
          localStorage.setItem(STORAGE_KEY_UNIFIED_ACTIVE, "true");
        }

        notifySectionsUpdated(globalSections, targetFiles);

        showToast(`✅ 已同步写入 ${checkedBoxes.length} 个页面物理文件！`);
      });
    }

    function loadEditText() {
      if (!editTextarea) return;
      if (globalSections.length) {
        editTextarea.value = globalSections.map(s => `### ${s.title}\n\n${s.content || ""}`).join("\n\n---\n\n");
      } else {
        editTextarea.value = "";
      }
    }

    if (saveEditBtn) {
      saveEditBtn.addEventListener("click", () => {
        if (!editTextarea) return;
        const text = editTextarea.value.trim();
        if (!text) {
          showToast("⚠️ 说明内容不能为空");
          return;
        }

        const parts = text.split(/\n\s*---\s*\n/);
        const newSections = [];
        parts.forEach((part, i) => {
          const lines = part.trim().split("\n");
          let title = `章节 ${i + 1}`;
          let bodyLines = lines;
          if (lines[0] && lines[0].startsWith("#")) {
            title = lines[0].replace(/^#+\s*/, "").trim();
            bodyLines = lines.slice(1);
          }
          newSections.push({
            id: `sec_${Date.now()}_${i}`,
            title: title || `章节 ${i + 1}`,
            content: bodyLines.join("\n").trim()
          });
        });

        globalSections.splice(0, globalSections.length, ...newSections);
        renderGlobalDocs().then(() => syncContext());

        if (globalSyncToggle && globalSyncToggle.checked) {
          localStorage.setItem(STORAGE_KEY_UNIFIED_DATA, JSON.stringify(globalSections));
        }

        notifySectionsUpdated(globalSections);

        showToast("✅ 已保存说明并持久化写入当前文件！");
      });
    }
  }

  applyUnifiedDocsIfActive();
  initSyncFeature();

  restoreDesktopDocsWidth();
  makeDesktopDocsResizable();
  ensureOverlayLayer(false);
  renderGlobalDocs()
    .then(() => {
      syncContext();
      requestAnimationFrame(() => requestAnimationFrame(() => auditLayout(true)));
    })
    .catch(error => {
      console.error("移动端原型说明渲染失败", error);
      syncContext();
    });
  applySheetSnap();
})();
