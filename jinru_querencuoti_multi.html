<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>多场考试待核对 - 聚合强弹引导</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /* ── 全局重置与基础设定 ── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html,
    body,
    #app {
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    :root {
      --primary-green: #20DCAD;
      --primary-dark: #00B383;
      --primary-blue: #3388FF;
      --text-main: #111112;
      --text-sub: #4C5061;
      --text-muted: #8C8D9B;
      --bg-page: #F5F7FB;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #E8EBF2;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── 手机视口容器 (390 x 844) ── */
    #app {
      width: 100%;
      max-width: 390px;
      height: 100%;
      max-height: 844px;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 48px rgba(28, 37, 65, 0.18);
      border-radius: 28px;
    }

    @media (max-width: 600px) {
      #app {
        max-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* ── 底层页面模拟 (模拟家长在学情看板时被弹窗覆盖) ── */
    .underlying-page-bg {
      position: absolute;
      inset: 0;
      background: #F9F9FC;
      z-index: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      filter: blur(4px) brightness(0.92);
      transition: filter 0.3s ease;
      pointer-events: none;
    }

    .mock-header {
      height: 160px;
      background: linear-gradient(180deg, #20DCAD 0%, #DDFDF8 100%);
      padding: 16px;
    }
    .mock-card {
      margin: -30px 16px 12px;
      height: 100px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .mock-card-2 {
      margin: 0 16px 12px;
      height: 140px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    /* 半透明黑底遮罩层 */
    .sheet-backdrop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 20;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    /* ── 核心抽屉主体 (Bottom Sheet Panel) ── */
    .bottom-floating-modal {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background: #FFFFFF;
      border-radius: 26px 26px 0 0;
      padding: 12px 18px calc(20px + env(safe-area-inset-bottom, 12px));
      z-index: 50;
      box-shadow: 0 -8px 36px rgba(17, 24, 39, 0.22);
      display: flex;
      flex-direction: column;
      max-height: 88%;
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sheet-handle-bar {
      width: 38px;
      height: 4px;
      border-radius: 2px;
      background: #DCE0E8;
      margin: 0 auto 10px;
    }

    /* 头部状态与标题 */
    .sheet-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sh-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sh-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #20DCAD 0%, #00B383 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0, 179, 131, 0.25);
    }

    .sh-title-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sh-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sh-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #00B383;
      background: #EAFBF5;
      padding: 1px 7px;
      border-radius: 8px;
    }

    .sh-badge.count {
      color: #2563EB;
      background: #EFF6FF;
    }

    .sh-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }

    .sh-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #F4F5F7;
      color: #8C8D9B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sh-close-btn:active { background: #E2E4E8; }

    /* 步骤进度可视化 (4步流程) */
    .sheet-step-tracker {
      background: #F8FAFC;
      border: 1px solid #EAEFF6;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .step-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
    }

    .step-item.done .step-dot {
      background: #111112;
      color: #FFFFFF;
    }

    .step-item.active .step-dot {
      background: #00B383;
      color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(0, 179, 131, 0.2);
    }

    .step-item.pending .step-dot {
      background: #E1E3EA;
      color: #9295A3;
    }

    .step-name {
      font-size: 10.5px;
      color: #6D7080;
      font-weight: 500;
    }

    .step-item.active .step-name {
      color: #00B383;
      font-weight: 700;
    }

    .step-connector {
      flex: 1;
      height: 2px;
      background: #E1E3EA;
      margin: -12px 4px 0;
    }
    .step-connector.done { background: #111112; }

    /* ── 核心：多任务卡片清单 ── */
    .multi-task-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 14px;
      max-height: 310px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .task-card-item {
      background: #FAFAFD;
      border: 1px solid #E8EBF2;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: all 0.15s ease;
    }

    .task-card-item:hover {
      border-color: #20DCAD;
      background: #FFFFFF;
      box-shadow: 0 4px 14px rgba(32, 220, 173, 0.1);
    }

    .tci-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tci-student-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .tci-student-badge.blue {
      background: #EBF3FF;
      color: #2563EB;
      border: 1px solid #BFDBFE;
    }
    .tci-student-badge.green {
      background: #ECFDF5;
      color: #059669;
      border: 1px solid #A7F3D0;
    }

    .tci-type-tag {
      font-size: 11px;
      color: #8C8D9B;
      font-weight: 500;
    }

    .tci-exam-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .tci-data-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFFFFF;
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px dashed #E2E6EF;
    }

    .tci-stats {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .tci-num {
      font-size: 20px;
      font-weight: 800;
      color: #FF5A5A;
      line-height: 1;
    }
    .tci-unit {
      font-size: 11.5px;
      font-weight: 600;
      color: #4C5061;
    }

    .tci-breakdown {
      font-size: 11px;
      color: #8C8D9B;
    }

    .btn-single-check {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 4px 10px;
      border-radius: 14px;
      background: #111112;
      color: #20DCAD;
      font-size: 11.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.12s;
    }
    .btn-single-check:active { transform: scale(0.96); }

    /* ── 底部操作按钮组 ── */
    .sheet-actions-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-batch-check {
      width: 100%;
      height: 46px;
      border-radius: 23px;
      border: none;
      background: #111112;
      color: #FFFFFF;
      font-size: 14.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(17, 17, 18, 0.25);
      transition: transform 0.12s, opacity 0.2s;
    }
    .btn-batch-check:active { transform: scale(0.98); opacity: 0.9; }

    .btn-batch-check .sparkle {
      color: #20DCAD;
      font-size: 16px;
    }

    .btn-dismiss-text {
      background: none;
      border: none;
      color: #8C8D9B;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      padding: 4px 0;
    }
    .btn-dismiss-text:hover { color: #4C5061; }

    /* 弹窗收起后的重开浮标 (原型演示专用) */
    .demo-reopen-pill {
      position: absolute;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      background: #111112;
      color: #20DCAD;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border: 1px solid rgba(32, 220, 173, 0.4);
    }

    /* 轻提示 Toast */
    .proto-float-toast {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #FFFFFF;
      font-size: 12.5px;
      padding: 8px 16px;
      border-radius: 18px;
      z-index: 999;
      pointer-events: none;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      white-space: nowrap;
    }
  </style>

  <style id="protoMobileAnnotationCss">
    :root {
      --protoMobile-accent: #3388ff;
      --protoMobile-accent-dark: #2167d9;
      --protoMobile-accent-soft: #f0f9ff;
      --protoMobile-ink: #223355;
      --protoMobile-muted: #6b7a99;
      --protoMobile-line: #dde1eb;
      --protoMobile-bg: #edf0f6;
      --protoMobile-device-width: 414px;
      --protoMobile-docs-width: 520px;
    }

    html.protoMobile-ready,
    html.protoMobile-ready body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    .protoMobile-stage,
    .protoMobile-stage *,
    .protoMobile-overlay-root,
    .protoMobile-overlay-root * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    .protoMobile-stage {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      width: 100vw;
      max-width: none;
      height: 100dvh;
      padding: 16px;
      display: grid;
      grid-template-columns: var(--protoMobile-docs-width) 8px var(--protoMobile-device-width) minmax(320px, 1fr);
      gap: 16px;
      align-items: center;
      overflow: hidden;
      background: var(--protoMobile-bg);
      color: var(--protoMobile-ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    .protoMobile-stage.no-docs {
      grid-template-columns: var(--protoMobile-device-width) minmax(320px, 1fr);
      justify-content: center;
    }
    .protoMobile-stage.no-docs .protoMobile-desktop-splitter { display: none; }
    .protoMobile-stage.no-docs .protoMobile-device { grid-column: 1; }
    .protoMobile-stage.no-docs .protoMobile-notes-panel { grid-column: 2; }

    .protoMobile-docs-panel { grid-column: 1; grid-row: 1; }
    .protoMobile-desktop-splitter { grid-column: 2; grid-row: 1; }
    .protoMobile-device { grid-column: 3; grid-row: 1; }
    .protoMobile-notes-panel { grid-column: 4; grid-row: 1; }

    .protoMobile-desktop-splitter {
      position: relative;
      width: 8px;
      min-width: 8px;
      height: min(896px, calc(100dvh - 32px));
      align-self: center;
      cursor: col-resize;
      touch-action: none;
      outline: none;
    }

    .protoMobile-desktop-splitter::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 3px;
      height: 56px;
      border-radius: 2px;
      background: #b8c2d3;
      transform: translate(-50%, -50%);
      transition: height 0.15s ease, background 0.15s ease;
    }

    .protoMobile-desktop-splitter:hover::after,
    .protoMobile-desktop-splitter:focus-visible::after,
    .protoMobile-desktop-splitter.is-dragging::after { height: 84px; background: var(--protoMobile-accent); }
    .protoMobile-stage.is-resizing { cursor: col-resize; user-select: none; }

    .protoMobile-device,
    .protoMobile-review-panel {
      height: min(896px, calc(100dvh - 32px));
      min-height: 0;
    }

    .protoMobile-device {
      position: relative;
      width: var(--protoMobile-device-width);
      min-width: 0;
      justify-self: center;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 12px 32px rgba(34, 51, 85, 0.12);
    }

    .protoMobile-device>[data-proto-app] {
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      margin: 0 !important;
    }

    .protoMobile-review-panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(51, 136, 255, 0.22);
      border-top: 3px solid rgba(51, 136, 255, 0.82);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 44px rgba(34, 51, 85, 0.1);
    }

    .protoMobile-panel-header {
      height: 56px;
      padding: 0 16px;
      border-bottom: 1px solid #e9edf5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      font-size: 16px;
    }

    .protoMobile-doc-layout {
      height: calc(100% - 56px);
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      min-height: 0;
    }

    .protoMobile-doc-nav {
      padding: 12px 8px;
      border-right: 1px solid #e9edf5;
      overflow-y: auto;
      background: #fbfcff;
    }

    .protoMobile-doc-nav button {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--protoMobile-muted);
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }

    .protoMobile-doc-nav button:hover,
    .protoMobile-doc-nav button.is-active {
      border-left-color: var(--protoMobile-accent);
      color: #235cb3;
      background: #e8f1ff;
    }

    .protoMobile-doc-content {
      min-width: 0;
      padding: 0 16px 24px;
      overflow: auto;
      scroll-behavior: smooth;
    }

    .protoMobile-doc-section {
      padding: 20px 0;
      border-bottom: 1px solid #e9edf5;
      scroll-margin-top: 12px;
    }
    .protoMobile-doc-section:last-child { border-bottom: 0; }
    .protoMobile-doc-section>h3 { margin: 0 0 12px; color: var(--protoMobile-ink); font-size: 16px; line-height: 24px; }

    .protoMobile-desktop-toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--protoMobile-muted);
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }

    .protoMobile-switch {
      position: relative;
      width: 40px;
      height: 24px;
      min-height: 0;
      flex: 0 0 auto;
      padding: 0;
      border: 0;
      border-radius: 12px;
      background: #ced4e0;
      cursor: pointer;
    }
    .protoMobile-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 4px rgba(34, 51, 85, 0.18);
      transition: transform 0.16s ease;
    }
    .protoMobile-switch[aria-checked="true"] { background: var(--protoMobile-accent); }
    .protoMobile-switch[aria-checked="true"]::after { transform: translateX(16px); }

    .protoMobile-filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #e9edf5;
      background: #fbfcff;
    }

    .protoMobile-filter-chip {
      padding: 4px 10px;
      border: 1px solid #d8e0ee;
      border-radius: 14px;
      background: #fff;
      color: var(--protoMobile-muted);
      font-size: 12px;
      cursor: pointer;
    }
    .protoMobile-filter-chip.is-active {
      border-color: var(--protoMobile-accent);
      background: #e8f1ff;
      color: #235cb3;
      font-weight: 600;
    }

    .protoMobile-note-list {
      height: calc(100% - 105px);
      padding: 12px 16px 20px;
      overflow: auto;
    }

    .protoMobile-note-card {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid #e4e9f2;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .protoMobile-note-card:hover { border-color: #b7cefb; }
    .protoMobile-note-card.is-active {
      border-color: var(--protoMobile-accent);
      box-shadow: 0 0 0 2px rgba(51, 136, 255, 0.18);
    }

    .protoMobile-note-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .protoMobile-note-badge {
      padding: 2px 6px;
      border-radius: 3px;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
    }
    .protoMobile-note-badge.type-modify { background: #e67e22; }
    .protoMobile-note-badge.type-new { background: #27ae60; }
    .protoMobile-note-badge.type-delete { background: #e74c3c; }
    .protoMobile-note-badge.type-original { background: #2980b9; }

    .protoMobile-note-card h4 {
      margin: 0;
      color: var(--protoMobile-ink);
      font-size: 14px;
      line-height: 20px;
    }

      color: #4b5874;
      font-size: 13px;
      line-height: 20px;
    }

    .protoMobile-overlay-root {
      position: fixed;
      inset: 0;
      z-index: 2147483100;
      pointer-events: none;
    }

    .protoMobile-marker {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 2px solid #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      pointer-events: auto;
      transform: translate(-50%, -50%);
    }
    .protoMobile-marker.type-original { background: #2980b9; }
    .protoMobile-marker.type-modify { background: #e67e22; }
    .protoMobile-marker.type-new { background: #27ae60; }
    .protoMobile-marker.type-delete { background: #e74c3c; }

    .protoMobile-compact-docs-trigger,
    .protoMobile-compact-close,
    .protoMobile-compact-backdrop,
    .protoMobile-mobile-controls,
    .protoMobile-mobile-note-layer,
    .protoMobile-mobile-docs-layer {
      display: none;
    }
  </style>
</head>

<body>

  <div id="app" data-proto-app data-proto-platform="mobile">
    <!-- 模拟底层学情看板页面 (高斯模糊背景) -->
    <div class="underlying-page-bg">
      <div class="mock-header"></div>
      <div class="mock-card"></div>
      <div class="mock-card-2"></div>
    </div>

    <!-- 半透明黑底遮罩 -->

  <script>
    function showToast(msg) {
      const toast = document.getElementById('protoFloatToast');
      if (!toast) return;
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2400);
    }

    function handleDismiss() {
      const modal = document.getElementById('bottomFloatingModal');
      const backdrop = document.getElementById('sheetBackdrop');
      const reopen = document.getElementById('demoReopenPill');
      if (modal) modal.style.transform = 'translateY(105%)';
      if (backdrop) backdrop.style.opacity = '0';
      setTimeout(() => {
        if (backdrop) backdrop.style.display = 'none';
        if (reopen) reopen.style.display = 'inline-flex';
      }, 300);
      showToast('已收录至首页【待核对试卷】卡片，3天内可随时核对');
    }

    function handleReopen() {
      const modal = document.getElementById('bottomFloatingModal');
      const backdrop = document.getElementById('sheetBackdrop');
      const reopen = document.getElementById('demoReopenPill');
      if (reopen) reopen.style.display = 'none';
      if (backdrop) {
        backdrop.style.display = 'block';
        setTimeout(() => { backdrop.style.opacity = '1'; }, 10);
      }
      if (modal) modal.style.transform = 'translateY(0)';
    }

    function goToBatchCheck() {
      showToast('正在启动连续核对流转... 第1场：张小晓期中考');
      setTimeout(() => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'SWITCH_PAGE', pageId: 'gouxuancuoti', path: 'gouxuancuoti.html?mode=batch&total=2' }, '*');
        }
        window.location.href = 'gouxuancuoti.html?mode=batch&total=2';
      }, 800);
    }

    function goToSingleCheck(examKey, studentName) {
      showToast(`正在进入【${studentName}】单独核对工作台...`);
      setTimeout(() => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'SWITCH_PAGE', pageId: 'gouxuancuoti', path: `gouxuancuoti.html?exam=${examKey}` }, '*');
        }
        window.location.href = `gouxuancuoti.html?exam=${examKey}`;
      }, 800);
    }
  </script>

  <!-- 标注运行时脚本 -->
  <script id="protoMobileMobileAnnotationRuntime">
    (() => {
      const dataNode = document.getElementById("prototypeAnnotationData");
      const stage = document.getElementById("protoMobileStage");
      const device = document.getElementById("protoMobileDevice");
      const docsPanel = document.getElementById("protoMobileDocsPanel");
      const docsSplitter = document.getElementById("protoMobileDocsSplitter");
      const docNav = document.getElementById("protoMobileDocNav");
      const docContent = document.getElementById("protoMobileDocContent");
      const noteList = document.getElementById("protoMobileNoteList");
      const filterBar = document.getElementById("protoMobileFilterBar");
      let activeFilter = "all";
      const desktopToggle = document.getElementById("protoMobileDesktopToggle");
      const overlayRoot = document.getElementById("prototypeAnnotationRoot");
      const markerLayer = document.getElementById("protoMobileMarkerLayer");

      if (!dataNode || !stage || !overlayRoot) return;

      let annotationData;
      try {
        annotationData = JSON.parse(dataNode.textContent);
      } catch (error) {
        console.error("解析标注数据失败", error);
        return;
      }

      const annotations = Array.isArray(annotationData.annotations) ? annotationData.annotations : [];
      const globalSections = Array.isArray(annotationData.globalSections) ? annotationData.globalSections : [];
      const appRoot = document.querySelector("[data-proto-app]");
      if (!appRoot) return;

      const deviceWidth = 390;
      const deviceHeight = 844;
      document.documentElement.style.setProperty("--protoMobile-device-width", `${deviceWidth}px`);
      document.documentElement.style.setProperty("--protoMobile-device-height", `${deviceHeight}px`);
      document.documentElement.classList.add("protoMobile-ready");
      document.body.appendChild(stage);
      document.body.appendChild(overlayRoot);
      device.appendChild(appRoot);
      stage.hidden = false;

      function renderGlobalDocs() {
        if (!docNav || !docContent) return;
        docNav.innerHTML = "";
        docContent.innerHTML = "";
        globalSections.forEach((sec, idx) => {
          const btn = document.createElement("button");
          btn.textContent = sec.title;
          btn.className = idx === 0 ? "is-active" : "";
          btn.onclick = () => {
            document.querySelectorAll(".protoMobile-doc-nav button").forEach(b => b.classList.remove("is-active"));
            btn.classList.add("is-active");
            const targetEl = document.getElementById(`doc-sec-${sec.id}`);
            if (targetEl) targetEl.scrollIntoView({ behavior: "smooth" });
          };
          docNav.appendChild(btn);

          const secEl = document.createElement("section");
          secEl.className = "protoMobile-doc-section";
          secEl.id = `doc-sec-${sec.id}`;
          secEl.innerHTML = `<h3>${sec.title}</h3><div>${sec.content}</div>`;
          docContent.appendChild(secEl);
        });
      }

      function renderNotes() {
        if (!noteList) return;
        noteList.innerHTML = "";
        markerLayer.innerHTML = "";

        const filtered = annotations.filter(n => activeFilter === "all" || n.type === activeFilter);
        filtered.forEach((note, idx) => {
          const card = document.createElement("div");
          card.className = "protoMobile-note-card";
          card.id = `card-${note.id}`;
          card.innerHTML = `
            <div class="protoMobile-note-head">
              <span class="protoMobile-note-badge type-${note.type}">${note.typeLabel || '标注'}</span>
              <h4>#${idx + 1} ${note.title}</h4>
            </div>
            <div class="protoMobile-note-body">${note.content}</div>
          `;
          card.onclick = () => highlightNote(note.id);
          noteList.appendChild(card);

          // 标注锚点
          const marker = document.createElement("button");
          marker.className = `protoMobile-marker type-${note.type}`;
          marker.textContent = String(idx + 1);
          marker.style.left = `${(note.x * 100).toFixed(1)}%`;
          marker.style.top = `${(note.y * 100).toFixed(1)}%`;
          marker.onclick = () => highlightNote(note.id);
          markerLayer.appendChild(marker);
        });
      }

      function highlightNote(id) {
        document.querySelectorAll(".protoMobile-note-card").forEach(c => c.classList.remove("is-active"));
        const card = document.getElementById(`card-${id}`);
        if (card) {
          card.classList.add("is-active");
          card.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      }

      function renderFilters() {
        if (!filterBar) return;
        filterBar.innerHTML = "";
        const types = [
          { key: "all", label: "全部" },
          { key: "new", label: "新增" },
          { key: "modify", label: "修改" }
        ];
        types.forEach(t => {
          const chip = document.createElement("button");
          chip.className = `protoMobile-filter-chip ${activeFilter === t.key ? "is-active" : ""}`;
          chip.textContent = t.label;
          chip.onclick = () => {
            activeFilter = t.key;
            renderFilters();
            renderNotes();
          };
          filterBar.appendChild(chip);
        });
      }

      if (desktopToggle) {
        desktopToggle.onclick = () => {
          const isChecked = desktopToggle.getAttribute("aria-checked") === "true";
          desktopToggle.setAttribute("aria-checked", String(!isChecked));
          markerLayer.style.display = isChecked ? "none" : "block";
        };
      }

      renderGlobalDocs();
      renderFilters();
      renderNotes();
    })();
  </script>
