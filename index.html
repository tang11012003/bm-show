/* 页面切换 Tab 胶囊 */

  margin: 0 16px;

  scrollbar-width: none;
}

  border-color: #94a3b8;
}

  color: #ffffff;

  font-weight: 700;

.hub-tools {

  align-items: center;
  gap: 8px;
}
.hub-btn {

  gap: 4px;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;

  background: #ffffff;
  color: #475569;

  transition: all 0.12s ease;
}
.hub-btn:hover {

  border-color: #94a3b8;

.hub-btn.primary {

.hub-frame {

const DEFAULT_PAGES_SIG = 'sig_' + DEFAULT_PAGES.map(p => `${p.id}:${p.visible}:${p.order || ''}`).join('|');


let pageList = [];
try {
  const savedSig = localStorage.getItem(UNIFIED_STORAGE_KEY + '_SIG');
  const saved = localStorage.getItem(UNIFIED_STORAGE_KEY);
  if (saved && savedSig === DEFAULT_PAGES_SIG) {
    pageList = JSON.parse(saved);
  } else {
    pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
    try {
      localStorage.setItem(UNIFIED_STORAGE_KEY, JSON.stringify(pageList));
      localStorage.setItem(UNIFIED_STORAGE_KEY + '_SIG', DEFAULT_PAGES_SIG);
    } catch(e) {}
  }
} catch(e) {
  pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
}

let activePageId = 'fenxi';

function init() {
  let seq = 1;
  pageList.forEach(p => {
    if (p.visible && (p.order === undefined || p.order === null || isNaN(p.order))) {
      p.order = seq++;
    }
  });

  renderTabs();
  const hash = window.location.hash.replace('#page=', '').toLowerCase();
  const matched = pageList.find(p => p.id.toLowerCase() === hash || p.path.toLowerCase().includes(hash));
  if (matched && matched.visible) {
    switchPage(matched.id);
  } else {
    const visiblePages = pageList
      .filter(p => p.visible)
      .sort((a, b) => (Number(a.order) || 9999) - (Number(b.order) || 9999));
    const firstVis = visiblePages[0] || pageList[0];
    if (firstVis) switchPage(firstVis.id);
  }
}

function renderTabs() {
  const bar = document.getElementById('hubTabsBar');
  bar.innerHTML = '';

  const visiblePages = pageList
    .filter(p => p.visible)
    .sort((a, b) => (Number(a.order) || 9999) - (Number(b.order) || 9999));

  visiblePages.forEach(p => {
    const chip = document.createElement('button');
    chip.className = `hub-tab-chip ${p.id === activePageId ? 'is-active' : ''}`;
    chip.textContent = p.name;
    chip.onclick = () => switchPage(p.id);
    bar.appendChild(chip);
  });
}

function switchPage(pageId) {
  const pg = pageList.find(p => p.id === pageId);
  if (!pg) return;

  activePageId = pg.id;
  window.location.hash = `page=${pg.id}`;

  renderTabs();

  const frame = document.getElementById('hubFrame');
  const targetBase = pg.path.split('?')[0];
  const currentBase = (frame.src || "").split('#')[0].split('?')[0];
  const cacheBuster = `_t=${Date.now()}`;
  const targetSrc = pg.path + (pg.path.includes('?') ? '&' : '?') + cacheBuster;
  if (!currentBase.endsWith(targetBase)) {
    frame.src = targetSrc;
  }
}

function reloadFrame() {
  const frame = document.getElementById('hubFrame');
  frame.src = frame.src;
}

  document.getElementById('hubModal').classList.add('show');

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('hubModal').classList.remove('show');
}

    text.innerHTML = `${p.name} <span style="color:#94a3b8;font-size:11.5px">(${p.path})</span>`;

    left.appendChild(chk);
    left.appendChild(text);

    const right = document.createElement('div');
    right.style.cssText = 'display:flex;align-items:center;gap:6px;flex-shrink:0;';

    const orderLabel = document.createElement('span');
    orderLabel.textContent = '排序:';
    orderLabel.style.cssText = 'font-size:12px;color:#64748b;';

    const orderInput = document.createElement('input');
    orderInput.type = 'number';
    orderInput.min = '1';
    orderInput.max = '99';
    orderInput.className = 'hub-modal-order-input';
    orderInput.value = p.visible && p.order ? p.order : '';
    orderInput.placeholder = '-';
    orderInput.disabled = !p.visible;
    orderInput.style.cssText = `width:46px;height:26px;text-align:center;border:1px solid ${p.visible ? '#2563eb' : '#cbd5e1'};border-radius:4px;font-size:12px;font-weight:600;color:${p.visible ? '#2563eb' : '#94a3b8'};background:${p.visible ? '#eff6ff' : '#f8fafc'};`;

    chk.onchange = () => {
      p.visible = chk.checked;
      if (chk.checked) {
        const maxOrder = pageList.reduce((max, item) => {
          return item.visible && item.order ? Math.max(max, Number(item.order)) : max;
        }, 0);
        p.order = maxOrder + 1;
        orderInput.value = p.order;
        orderInput.disabled = false;
        orderInput.style.border = '1px solid #2563eb';
        orderInput.style.color = '#2563eb';
        orderInput.style.background = '#eff6ff';
      } else {
        p.order = null;
        orderInput.value = '';
        orderInput.disabled = true;
        orderInput.style.border = '1px solid #cbd5e1';
        orderInput.style.color = '#94a3b8';
        orderInput.style.background = '#f8fafc';
      }
    };

    orderInput.oninput = () => {
      const val = parseInt(orderInput.value, 10);
      p.order = isNaN(val) ? 999 : val;
    };

    const delBtn = document.createElement('button');
    delBtn.style.cssText = 'border:none;background:none;color:#ef4444;cursor:pointer;font-size:12px;padding:2px 4px;';
    delBtn.textContent = '删除';
    delBtn.onclick = () => {
      pageList.splice(idx, 1);
      renderModalList();
    };

    right.appendChild(orderLabel);
    right.appendChild(orderInput);
    right.appendChild(delBtn);

    row.appendChild(left);
    row.appendChild(right);
    container.appendChild(row);
  });
}

function handleAddPage() {
  const name = document.getElementById('newPgName').value.trim();
  const path = document.getElementById('newPgPath').value.trim();
  if (!name || !path) {
    alert('请填写页面名称和文件路径');
    return;
  }
  const maxOrder = pageList.reduce((max, item) => {
    return item.visible && item.order ? Math.max(max, Number(item.order)) : max;
  }, 0);
  pageList.push({
    id: path.replace('.html', ''),
    name: name,
    path: path,
    visible: true,
    order: maxOrder + 1
  });
  document.getElementById('newPgName').value = '';
  document.getElementById('newPgPath').value = '';
  renderModalList();
}

function resetDefaults() {
  if (confirm('确认恢复默认 42 页面清单？')) {
    pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
    renderModalList();
  }
}

function savePages() {
  // 核心：按用户设定的序号升序排序?
  pageList.sort((a, b) => {
    const aVis = a.visible !== false;
    const bVis = b.visible !== false;
    if (aVis && bVis) {
      return (Number(a.order) || 9999) - (Number(b.order) || 9999);
    }
    if (aVis) return -1;
    if (bVis) return 1;
    return 0;
  });

  // 规整为连续的 1, 2, 3...
  let seq = 1;
  pageList.forEach(p => {
    if (p.visible) p.order = seq++;
  });

  localStorage.setItem(UNIFIED_STORAGE_KEY, JSON.stringify(pageList));
  renderTabs();
  closeModal();
}


// 挂载 iframe 内部路由守护与拦截未勾选页面
function attachHubFrameNavigationGuard() {
  const frame = document.getElementById('hubFrame');
  if (!frame) return;
  try {
    const iframeWin = frame.contentWindow;
    const iframeDoc = frame.contentDocument;
    if (!iframeWin || !iframeDoc) return;

    // 1. 同步当前实际加载的页面
    const pathname = iframeWin.location.pathname || '';
    const rawFile = pathname.split(/[?#]/)[0].split('/').pop();
    if (rawFile && pageList) {
      const matched = pageList.find(p => p.path === rawFile || p.id === rawFile.replace(/\.html$/i, ''));
      if (matched) {
        if (!matched.visible) {
          const curPg = pageList.find(p => p.id === activePageId);
          if (curPg && curPg.visible && curPg.path !== rawFile) {
            showHubToast(`⚠️ 页面「${matched.name || rawFile}」未在「页面管理」中勾选，已拦截跳转`);
            frame.src = curPg.path;
            return;
          }
        } else if (activePageId !== matched.id) {
          activePageId = matched.id;
          window.location.hash = `page=${matched.id}`;
          renderTabs();
        }
      }
    }

    // 2. 捕获 iframe 内的所有点击
    iframeDoc.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (link) {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
          const targetFile = href.split(/[?#]/)[0].split('/').pop();
          if (targetFile && targetFile.endsWith('.html')) {
            const matched = pageList.find(p => p.path === targetFile || p.id === targetFile.replace(/\.html$/i, ''));
            if (matched) {
              if (!matched.visible) {
                // 不在勾选页面中：无反应 + 轻提示！
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                showHubToast(`⚠️「${matched.name}」未在页面管理中勾选，暂不开放跳转`);
                return;
              } else {
                // 已勾选页面：联动切换
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                switchPage(matched.id);
                return;
              }
            }
          }
        }
      }

      const clickEl = e.target.closest('[onclick]');
      if (clickEl) {
        const onclickStr = clickEl.getAttribute('onclick') || '';
        const match = onclickStr.match(/(?:window\.)?location(?:\.href)?\s*=\s*['"`]([^'"`]+)['"`]/);
        if (match && match[1]) {
          const href = match[1];
          const targetFile = href.split(/[?#]/)[0].split('/').pop();
          if (targetFile && targetFile.endsWith('.html')) {
            const matched = pageList.find(p => p.path === targetFile || p.id === targetFile.replace(/\.html$/i, ''));
            if (matched) {
              if (!matched.visible) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                showHubToast(`⚠️「${matched.name}」未在页面管理中勾选，暂不开放跳转`);
                return;
              } else {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                switchPage(matched.id);
                return;
              }
            }
          }
        }
      }
    }, true);
  } catch(err) {
    console.warn('attachHubFrameNavigationGuard error:', err);
  }
}

function showHubToast(msg) {
  let toast = document.getElementById('hub-nav-guard-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'hub-nav-guard-toast';
    toast.style.cssText = `
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 999999;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(window._hubToastTimer);
  window._hubToastTimer = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-6px)';
  }, 2200);
}

window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'SWITCH_PAGE') {
    const target = (e.data.pageId || e.data.path || '').replace(/\.html$/i, '');
    if (target && typeof switchPage === 'function') {
      switchPage(target);
    }
  }
});
window.addEventListener('DOMContentLoaded', () => {
  init();
  const frame = document.getElementById('hubFrame');
  if (frame) {
    frame.addEventListener('load', attachHubFrameNavigationGuard);
  }
});
</script>
