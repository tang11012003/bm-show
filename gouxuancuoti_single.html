<body>

<div id="app" data-proto-app data-proto-platform="mobile">
  <!-- 顶部返回导航栏 -->
  <div class="top-header-bar">
    <button class="back-icon-btn" onclick="history.back()" title="返回上一页">
      <span class="material-icons" style="font-size:24px">arrow_back_ios_new</span>

    <div class="page-title-center">确认错题信息</div>
    <button class="btn-header-skip" onclick="skipToLoading()" title="跳过核对直接生成报告">跳过</button>
  </div>

  <!-- 主滚动列表 -->
  <div class="cards-scroll-view" id="cardsScrollView">
    <!-- 外部标题栏 (默认科目 + 考试名) -->
    <div class="section-title-row">
      <div class="subj-gem-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L21 7.2V16.8L12 22L3 16.8V7.2L12 2Z" stroke="#20DCAD" stroke-width="2" stroke-linejoin="round"/>
          <path d="M7 8.5L12 17L17 8.5" stroke="#20DCAD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="section-title-text" style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:13px;color:#6D7080;font-weight:500;">默认科目:</span>
        <button class="single-subject-pill" id="btnChangeSubjPill" type="button" onclick="openSubjectChangeSheet()" title="点击切换默认科目">
          <span id="currentSubjName">数学</span>
          <span class="material-icons" style="font-size:15px;color:#00B383;">expand_more</span>
        </button>
        <span style="color:#CBD0DC;margin:0 2px;">·</span>
        <span id="examTitleText" style="font-size:14px;color:#111112;font-weight:600;">09月30日单科数学</span>
      </div>
    </div>

    <!-- 单科卡片 (聚焦当前选中学科) -->
    <div class="diag-paper-card" id="paperCardSingle">
      <!-- 试卷原图 Cover -->
      <div class="paper-photo-banner" onclick="openZoomModal()">
        <img src="https://image-resource.mastergo.com/60579938713982/60579938713984/feb5bcfe627a401bca8e9282e8380048.png" alt="试卷原图">
        <div class="paper-float-tip">以下是试卷题号，点击修正题目对/错状态</div>
        <button class="btn-view-paper-raw" type="button">
          <span class="material-icons" style="font-size:14px">image</span>
          <span>查看试卷原图</span>
        </button>
      </div>

      <!-- 卡片内容区域 -->
      <div class="card-content-wrap">
        <!-- 识别统计行 -->
        <div class="ai-stat-line" id="aiStatLine">
          小苗共识别出 <span class="num-green" id="statTotalQ">22</span> 道题，判断错误 <span class="num-orange" id="statWrongQ">5</span> 道
        </div>

        <!-- 状态图例说明条 -->
        <div class="stat-legend-row">
          <div class="legend-items-left">
            <div class="legend-badge"><span class="legend-dot-circle green"></span>正确</div>
            <div class="legend-badge"><span class="legend-dot-circle orange"></span>错误</div>
            <div class="legend-badge"><span class="legend-dot-circle half"></span>半对</div>
          </div>
          <div class="legend-hint-action" id="legendHintAction">
            点击题号修正对错
          </div>
        </div>

        <!-- 题号圆形宫格 (6列精确对齐) -->
        <div class="q-grid-scroll-box">
          <div class="question-circles-grid" id="questionCirclesGrid">
            <!-- 动态生成 22 道题圆形状态 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部吸底操作栏 -->
  <div class="bottom-fixed-dock">
    <button class="btn-generate-report" id="btnSubmitGenerate" type="button" onclick="submitAndGenerate()">
      <span style="display:inline-flex;align-items:center;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18">
          <path d="M10,0 C10,5.523 14.477,10 20,10 C14.477,10 10,14.477 10,20 C10,14.477 5.523,10 0,10 C5.523,10 10,5.523 10,0 Z" fill="#05FFD5"/>
          <path d="M10,4 C10,7.314 12.686,10 16,10 C12.686,10 10,12.686 10,16 C10,12.686 7.314,10 4,10 C7.314,10 10,7.314 10,4 Z" fill="#FFFFFF"/>
        </svg>
      </span>
      <span>直接生成诊断报告</span>
    </button>
    <div style="width:134px;height:5px;background:#000000;opacity:0.18;border-radius:2.5px;margin-top:8px;"></div>
  </div>
    <!-- 查看试卷大图弹窗 (置于 #app 内部) -->
    <div class="image-zoom-overlay" id="imageZoomModal" onclick="closeZoomModal()">
      <button class="close-zoom-btn" onclick="closeZoomModal()"><span class="material-icons">close</span></button>
      <div class="image-zoom-box" onclick="event.stopPropagation()">
        <img id="zoomImgTarget" src="https://image-resource.mastergo.com/60579938713982/60579938713984/feb5bcfe627a401bca8e9282e8380048.png" alt="试卷原图">
      </div>
    </div>

    <div class="toast-msg" id="toastMsg"></div>

    <!-- 单科切换学科抽屉 (精确还原图一学科弹窗，置于 #app 内部) -->
    <div class="modal-overlay" id="subjectOverlay" onclick="closeSubjectChangeSheet()"></div>
    <div class="modal-sheet" id="subjectSheet">
      <div class="modal-title">选择所属学科</div>
      <div class="subject-pill-grid">
        <div class="sub-select-pill active" data-sub="数学" onclick="selectDefaultSubject('数学')">数学</div>
        <div class="sub-select-pill" data-sub="语文" onclick="selectDefaultSubject('语文')">语文</div>
        <div class="sub-select-pill" data-sub="英语" onclick="selectDefaultSubject('英语')">英语</div>
        <div class="sub-select-pill" data-sub="物理" onclick="selectDefaultSubject('物理')">物理</div>
        <div class="sub-select-pill" data-sub="化学" onclick="selectDefaultSubject('化学')">化学</div>
        <div class="sub-select-pill" data-sub="生物" onclick="selectDefaultSubject('生物')">生物</div>
      </div>
    </div>
  </div>

<script>
// 1. 获取 URL 参数
const urlParams = new URLSearchParams(window.location.search);
const paramSubject = urlParams.get('subject') || '数学';
const paramExam = urlParams.get('exam') || urlParams.get('examName') || '';

// 2. 读取 localStorage 上下文
let uploadCtx = null;
let step1 = null;
try {
  uploadCtx = JSON.parse(localStorage.getItem('uploadContext') || 'null');
  step1 = JSON.parse(localStorage.getItem('uploadStep1') || 'null');
} catch(e) {}

let currentSubject = paramSubject || (uploadCtx && uploadCtx.subjects && uploadCtx.subjects[0]) || (step1 && step1.subject) || '数学';

function getDefaultExamName(sub) {
  let d = new Date();
  if (step1 && step1.examDate) {
    const parts = step1.examDate.split('-');
    if (parts.length >= 3) {
      d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }
  }
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${m}月${day}日单科${sub}`;
}

let rawExam = paramExam || (uploadCtx && uploadCtx.examName) || (step1 && step1.examName) || '';
let isCustomExamName = (rawExam && rawExam !== '未命名考试' && !rawExam.includes('单科') && rawExam !== '期末考试周' && rawExam !== '随堂小测' && rawExam !== '数学随堂小测');
let currentExamName = isCustomExamName ? rawExam : getDefaultExamName(currentSubject);

// 3. 错题预设表 (与初筛引导数据完全契合)
const PRESET_WRONG_MAP = {
  '数学': [1, 5, 8, 13, 19],     // 5 错题
  '语文': [3, 11],             // 2 错题
  '英语': [2, 7, 14, 18],       // 4 错题
  '物理': [4, 9, 15],          // 3 错题
  '化学': [6, 12],             // 2 错题
  '生物': [5]                  // 1 错题
};

let questions = [];
function initQuestions(sub) {
  questions = [];
  const wrongNums = PRESET_WRONG_MAP[sub] || [1, 5, 8];
  for (let i = 1; i <= 22; i++) {
    questions.push({
      num: i,
      state: wrongNums.includes(i) ? 'wrong' : 'correct',
      isFixed: false
    });
  }
}

// 初始化题目数据
initQuestions(currentSubject);

// 4. 渲染界面
function renderView() {
  document.getElementById('currentSubjName').textContent = currentSubject;
  document.getElementById('examTitleText').textContent = currentExamName;

  const totalQ = questions.length;
  const wrongCount = questions.filter(q => q.state === 'wrong').length;
  const fixedCount = questions.filter(q => q.isFixed).length;

  // 识别统计文本
  const statEl = document.getElementById('aiStatLine');
  if (statEl) {
    statEl.innerHTML = `小苗共识别出 <span class="num-green">${totalQ}</span> 道题，判断错误 <span class="num-orange">${wrongCount}</span> 道${fixedCount > 0 ? `，当前修正为错题 <span class="num-orange">${wrongCount}</span> 道` : ''}`;
  }

  // 提示操作文本
  const hintEl = document.getElementById('legendHintAction');
  if (hintEl) {
    hintEl.textContent = fixedCount > 0 ? `人工修正${fixedCount}道` : '点击题号修正对错';
  }

  // 渲染 22 道题矩阵
  const gridEl = document.getElementById('questionCirclesGrid');
  if (gridEl) {
    gridEl.innerHTML = questions.map((q, idx) => `
      <div class="q-circle-wrap" onclick="toggleQuestionState(${idx})">
        <div class="q-circle-btn ${q.state}">
          ${q.num}
        </div>
        ${q.isFixed ? '<div class="fix-tag-pill">修正</div>' : ''}
      </div>
    `).join('');
  }
}

// 5. 点击题号正误切换 (正确 ➔ 错误 ➔ 半对 ➔ 正确)
function toggleQuestionState(qIdx) {
  const q = questions[qIdx];
  if (q.state === 'correct') {
    q.state = 'wrong';
  } else if (q.state === 'wrong') {
    q.state = 'half';
  } else {
    q.state = 'correct';
  }
  q.isFixed = true;
  renderView();
}

// 6. 科目切换抽屉 (图一学科弹窗)
function openSubjectChangeSheet() {
  document.querySelectorAll('.sub-select-pill').forEach(btn => {
    const isAct = (btn.dataset.sub === currentSubject || btn.textContent.trim() === currentSubject);
    btn.classList.toggle('active', isAct);
  });
  const overlay = document.getElementById('subjectOverlay');
  const sheet = document.getElementById('subjectSheet');
  if (overlay) overlay.classList.add('is-open');
  if (sheet) sheet.classList.add('is-open');
}

function closeSubjectChangeSheet() {
  const overlay = document.getElementById('subjectOverlay');
  const sheet = document.getElementById('subjectSheet');
  if (overlay) overlay.classList.remove('is-open');
  if (sheet) sheet.classList.remove('is-open');
}

function selectDefaultSubject(newSub) {
  if (currentSubject === newSub) {
    closeSubjectChangeSheet();
    return;
  }
  currentSubject = newSub;
  if (!isCustomExamName) {
    currentExamName = getDefaultExamName(newSub);
  }
  initQuestions(newSub);
  closeSubjectChangeSheet();
  renderView();
  showToast(`已将默认科目切换为【${newSub}】`);
}

// 别名与兼容函数
function openSubjectSheet() { openSubjectChangeSheet(); }
function closeSubjectSheet() { closeSubjectChangeSheet(); }
function changeSingleSubject(newSub) { selectDefaultSubject(newSub); }

// 7. 原图预览弹窗
function openZoomModal() {
  document.getElementById('imageZoomModal').classList.add('show');
}
function closeZoomModal() {
  document.getElementById('imageZoomModal').classList.remove('show');
}

// 8. 提示消息 Toast
function showToast(msg) {
  const t = document.getElementById('toastMsg');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2000);
}

// 9. 路由跳转
function getNextUrl() {
  const query = new URLSearchParams({
    from: 'gouxuancuoti_single',
    type: 'small',
    subject: currentSubject,
    examName: currentExamName
  });
  return 'loading.html?' + query.toString();
}

function skipToLoading() {
  window.location.href = getNextUrl();
}

function submitAndGenerate() {
  const subjectDataMap = {};
  subjectDataMap[currentSubject] = {
    total: questions.length,
    origWrongCount: PRESET_WRONG_MAP[currentSubject]?.length || 3,
    questions: questions,
    isEdited: questions.some(q => q.isFixed)
  };
  localStorage.setItem('confirmedWrongQuestions', JSON.stringify(subjectDataMap));
  showToast('错题已确认，开始生成诊断报告…');
  setTimeout(() => {
    window.location.href = getNextUrl();
  }, 400);
}

<script id="protoMobileAnnotationRuntime">
(() => {
  const dataScript = document.getElementById("prototypeAnnotationData");
  if (!dataScript) return;

  let rawData = {};
  try {
    rawData = JSON.parse(dataScript.textContent || "{}");
  } catch (error) {
    console.error("解析 prototypeAnnotationData 失败", error);
    return;
  }

  const annotations = Array.isArray(rawData.annotations) ? rawData.annotations : [];
  const globalSections = Array.isArray(rawData.globalSections) ? rawData.globalSections : [];
  const mobileConfig = rawData.mobile && typeof rawData.mobile === "object" ? rawData.mobile : {};
  const stage = document.getElementById("protoMobileStage");
  const device = document.getElementById("protoMobileDevice");
  const notesPanel = document.querySelector(".protoMobile-notes-panel");
  const docsPanel = document.getElementById("protoMobileDocsPanel");
  const docsNav = document.getElementById("protoMobileDocNav");
  const docsContent = document.getElementById("protoMobileDocContent");
  const splitter = document.getElementById("protoMobileDocsSplitter");
  const desktopToggle = document.getElementById("protoMobileDesktopToggle");
  const noteList = document.getElementById("protoMobileNoteList");
  const filterBar = document.getElementById("protoMobileFilterBar");
  const overlayRoot = document.getElementById("prototypeAnnotationRoot");
  const markerLayer = document.getElementById("protoMobileMarkerLayer");
  const mobileLauncher = document.getElementById("protoMobileMobileLauncher");
  const mobileCount = document.getElementById("protoMobileMobileCount");
  const mobileMenu = document.getElementById("protoMobileMobileMenu");
  const mobileMenuMeta = document.getElementById("protoMobileMobileMenuMeta");
  const mobileToggle = document.getElementById("protoMobileMobileToggle");
  const mobileNoteLayer = document.getElementById("protoMobileMobileNoteLayer");
  const mobileNoteMask = document.getElementById("protoMobileMobileNoteMask");
  const mobileNoteClose = document.getElementById("protoMobileMobileNoteClose");
  const mobileSheet = document.getElementById("protoMobileMobileSheet");
  const mobileSheetTitle = document.getElementById("protoMobileMobileSheetTitle");
  const mobileSheetBody = document.getElementById("protoMobileMobileSheetBody");
  const mobileSheetSize = document.getElementById("protoMobileMobileSheetSize");
  const mobileSheetHandle = document.getElementById("protoMobileMobileSheetHandle");
  const compactDocsTrigger = document.getElementById("protoMobileCompactDocsTrigger");
  const compactBackdrop = document.getElementById("protoMobileCompactBackdrop");
  const compactDocsClose = document.getElementById("protoMobileCompactDocsClose");
  const mobileDocsOpen = document.getElementById("protoMobileMobileDocsOpen");
  const mobileDocsLayer = document.getElementById("protoMobileMobileDocsLayer");
  const mobileDocsClose = document.getElementById("protoMobileMobileDocsClose");
  const mobileDocsBody = document.getElementById("protoMobileMobileDocsBody");
  const appRoot = document.querySelector(mobileConfig.appRoot || "[data-proto-app]") || document.querySelector("#app");

  if (!appRoot || !stage || !device || !overlayRoot || !markerLayer) return;

  const storageKey = `protoMobile_visible_${rawData.prototypeId || "default"}`;
  const docsWidthKey = "protoMobile_desktop_docs_width";
  let activeFilter = "all";
  let activeNoteId = null;
  let currentNotes = [];
  let isMobile = window.innerWidth <= 767;
  let isVisible = localStorage.getItem(storageKey) !== "false";

  function updateDesktopToggle(val) {
    if (desktopToggle) {
      desktopToggle.setAttribute("aria-checked", String(val));
    }
  }

  function updateMobileToggle(val) {
    if (mobileToggle) {
      mobileToggle.setAttribute("aria-checked", String(val));
    }
  }

  function renderFilterBar() {
    if (!filterBar) return;
    const types = [
      { key: "all", label: "全部", cls: "chip-all", count: annotations.length },
      { key: "add", label: "新增", cls: "chip-add", count: annotations.filter(n => n.type === "add").length },
      { key: "modify", label: "修改", cls: "chip-modify", count: annotations.filter(n => n.type === "modify").length },
      { key: "original", label: "原有", cls: "chip-original", count: annotations.filter(n => n.type === "original").length }
    ];
    filterBar.innerHTML = types.map(t => `
      <button class="protoMobile-filter-chip ${t.cls} ${activeFilter === t.key ? "is-active" : ""}" type="button" data-filter="${t.key}">
        <span>${t.label}</span>
        <span class="protoMobile-filter-count">${t.count}</span>
      </button>
    `).join("");

    filterBar.querySelectorAll(".protoMobile-filter-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        renderFilterBar();
        renderNoteList();
        renderMarkers();
      });
    });
  }

  function renderNoteList() {
    if (!noteList) return;
    const filtered = annotations.filter(n => activeFilter === "all" || n.type === activeFilter);
    noteList.innerHTML = filtered.map((n, idx) => `
      <div class="protoMobile-note-card ${activeNoteId === n.id ? "is-active" : ""}" data-id="${n.id}">
        <div class="protoMobile-note-card-head">
          <span class="protoMobile-badge">${idx + 1}</span>
          <span class="protoMobile-note-title">${n.title || "标注说明"}</span>
        </div>
        <div class="protoMobile-rich-content">${n.content || ""}</div>
      </div>
    `).join("");

    noteList.querySelectorAll(".protoMobile-note-card").forEach(card => {
      card.addEventListener("click", () => {
        activeNoteId = card.dataset.id;
        renderNoteList();
        renderMarkers();
        const note = annotations.find(n => n.id === activeNoteId);
        if (note && note.target) {
          const el = document.querySelector(note.target);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      });
    });
  }

  function renderMarkers() {
    markerLayer.innerHTML = "";
    if (!isVisible) return;
    const filtered = annotations.filter(n => activeFilter === "all" || n.type === activeFilter);
    filtered.forEach((n, idx) => {
      const target = document.querySelector(n.target);
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const marker = document.createElement("button");
      marker.className = `protoMobile-marker ${activeNoteId === n.id ? "is-active" : ""}`;
      marker.textContent = String(idx + 1);
      const posX = rect.left + rect.width * (n.x !== undefined ? n.x : 0.5);
      const posY = rect.top + rect.height * (n.y !== undefined ? n.y : 0.5);
      marker.style.left = `${posX}px`;
      marker.style.top = `${posY}px`;
      marker.addEventListener("click", (e) => {
        e.stopPropagation();
        activeNoteId = n.id;
        renderNoteList();
        renderMarkers();
        if (isMobile) {
          mobileSheetTitle.textContent = n.title || "标注详情";
          mobileSheetBody.innerHTML = n.content || "";
          mobileNoteLayer.classList.add("is-open");
        }
      });
      markerLayer.appendChild(marker);
    });
  }

  function renderDocs() {
    if (!docsNav || !docsContent) return;
    docsNav.innerHTML = globalSections.map(sec => `
      <button type="button" class="protoMobile-nav-item" data-sec="${sec.id}">${sec.title}</button>
    `).join("");
    docsContent.innerHTML = globalSections.map(sec => `
      <section class="protoMobile-doc-section" id="sec_${sec.id}">
        <h3>${sec.title}</h3>
        <div class="protoMobile-rich-content">${sec.content}</div>
      </section>
    `).join("");

    if (mobileDocsBody) {
      mobileDocsBody.innerHTML = globalSections.map(sec => `
        <div style="margin-bottom:20px;">
          <h3 style="font-size:16px;margin-bottom:8px;color:#1e293b;">${sec.title}</h3>
          <div class="protoMobile-rich-content">${sec.content}</div>
        </div>
      `).join("");
    }
  }

  function setupEvents() {
    if (desktopToggle) {
      desktopToggle.addEventListener("click", () => {
        isVisible = !isVisible;
        localStorage.setItem(storageKey, String(isVisible));
        updateDesktopToggle(isVisible);
        updateMobileToggle(isVisible);
        renderMarkers();
      });
    }

    if (mobileToggle) {
      mobileToggle.addEventListener("click", () => {
        isVisible = !isVisible;
        localStorage.setItem(storageKey, String(isVisible));
        updateDesktopToggle(isVisible);
        updateMobileToggle(isVisible);
        renderMarkers();
      });
    }

    if (mobileLauncher) {
      mobileLauncher.addEventListener("click", () => {
        mobileMenu.classList.toggle("is-open");
      });
    }

    if (mobileNoteMask) mobileNoteMask.addEventListener("click", () => mobileNoteLayer.classList.remove("is-open"));
    if (mobileNoteClose) mobileNoteClose.addEventListener("click", () => mobileNoteLayer.classList.remove("is-open"));

    if (mobileDocsOpen) {
      mobileDocsOpen.addEventListener("click", () => {
        mobileMenu.classList.remove("is-open");
        mobileDocsLayer.classList.add("is-open");
      });
    }
    if (mobileDocsClose) mobileDocsClose.addEventListener("click", () => mobileDocsLayer.classList.remove("is-open"));

    if (compactDocsTrigger) {
      compactDocsTrigger.addEventListener("click", () => {
        docsPanel.classList.add("is-compact-open");
        compactBackdrop.classList.add("is-open");
      });
    }
    if (compactDocsClose) {
      compactDocsClose.addEventListener("click", () => {
        docsPanel.classList.remove("is-compact-open");
        compactBackdrop.classList.remove("is-open");
      });
    }
    if (compactBackdrop) {
      compactBackdrop.addEventListener("click", () => {
        docsPanel.classList.remove("is-compact-open");
        compactBackdrop.classList.remove("is-open");
      });
    }

    window.addEventListener("resize", () => {
      isMobile = window.innerWidth <= 767;
      renderMarkers();
    });
    window.addEventListener("scroll", () => renderMarkers(), true);
  }

  function init() {
    document.documentElement.classList.add("protoMobile-ready");
    stage.removeAttribute("hidden");
    device.appendChild(appRoot);
    if (typeof overlayRoot.showPopover === "function") {
      try { overlayRoot.showPopover(); } catch(e) {}
    }
    updateDesktopToggle(isVisible);
    updateMobileToggle(isVisible);
    if (mobileCount) mobileCount.textContent = String(annotations.length);
    if (mobileMenuMeta) mobileMenuMeta.textContent = `当前页面 ${annotations.length} 条`;

    renderDocs();
    renderFilterBar();
    renderNoteList();
    setupEvents();
    setTimeout(renderMarkers, 150);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
