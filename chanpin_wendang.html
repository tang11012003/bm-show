* {

}

body {

  display: flex;
  flex-direction: column;

/* 顶部极简浅色导航总控栏 */

  height: 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
}

.hub-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hub-tag {
  background: #3388ff;
  color: #ffffff;
  font-size: 11px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
  letter-spacing: 0.5px;
}
.hub-title {
  font-size: 14px;
  font-weight: 700;
  color: #1e293b;
}

/* 页面切换 Tab 胶囊 */
.hub-tabs-container {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  margin: 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.hub-tabs-container::-webkit-scrollbar { display: none; }

.hub-tab-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 16px;
  font-size: 12.5px;
  font-weight: 500;
  text-decoration: none;
  background: #f8fafc;
  color: #475569;
  border: 1px solid #cbd5e1;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.12s ease;
}
.hub-tab-chip:hover {
  background: #f1f5f9;
  color: #0f172a;
  border-color: #94a3b8;
}
.hub-tab-chip.is-active {
  background: #3388ff;
  color: #ffffff;
  border-color: #3388ff;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(51, 136, 255, 0.25);
}

.hub-tools {
  display: flex;
  align-items: center;
  gap: 8px;
}
.hub-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #475569;
  cursor: pointer;
  transition: all 0.12s ease;
}
.hub-btn:hover {
  background: #f8fafc;
  border-color: #94a3b8;
  color: #0f172a;
}
.hub-btn.primary {
  background: #eff6ff;
  color: #1d4ed8;
  border-color: #93c5fd;
  font-weight: 600;
}

/* 主体容器：100% 呈现目标页面原汁原味的三栏审阅器 */
.hub-viewport {
  flex: 1;
  width: 100%;
  height: calc(100vh - 48px);
  position: relative;
  background: #edf0f6;
}
.hub-frame {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  display: block;
}

/* 页面管理弹窗 */
.hub-modal {

  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);

  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.hub-modal.show { display: flex; }
.hub-modal-box {

let pageList = [];
try {
  const saved = localStorage.getItem(UNIFIED_STORAGE_KEY);
  pageList = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_PAGES));
} catch(e) {
  pageList = JSON.parse(JSON.stringify(DEFAULT_PAGES));
}

let activePageId = 'fenxi';

function init() {
  renderTabs();
  const hash = window.location.hash.replace('#page=', '').toLowerCase();
  const matched = pageList.find(p => p.id.toLowerCase() === hash || p.path.toLowerCase().includes(hash));
  if (matched && matched.visible) {
    switchPage(matched.id);
  } else {
    const firstVis = pageList.find(p => p.visible) || pageList[0];
    if (firstVis) switchPage(firstVis.id);
  }
}

function renderTabs() {
  const bar = document.getElementById('hubTabsBar');
  bar.innerHTML = '';

  pageList.filter(p => p.visible).forEach(p => {
    const chip = document.createElement('button');
    chip.className = `hub-tab-chip ${p.id === activePageId ? 'is-active' : ''}`;
    chip.textContent = p.name;
    chip.onclick = () => switchPage(p.id);
    bar.appendChild(chip);
  });
}

function switchPage(pageId) {
  const pg = pageList.find(p => p.id === pageId);
  if (!pg) return;

  activePageId = pg.id;
  window.location.hash = `page=${pg.id}`;

  renderTabs();

  const frame = document.getElementById('hubFrame');
  if (!frame.src.endsWith(pg.path)) {
    frame.src = pg.path;
  }
}

function reloadFrame() {
  const frame = document.getElementById('hubFrame');
  frame.src = frame.src;
}

function openDocsSyncModalFromHub() {
  const frame = document.getElementById('hubFrame');
  try {
    if (frame.contentWindow && frame.contentDocument) {
      const btn = frame.contentDocument.getElementById('protoMobileDocSyncBtn');
      if (btn) {
        btn.click();
        return;
      }
    }
  } catch(e) {}
  alert('提示：请直接在下方内嵌原型的左侧【原型说明】标题栏点击 [跨页复制/同步] 按钮进行管理。');
}

// 页面管理弹窗
function openModal() {
  renderModalList();
  document.getElementById('hubModal').classList.add('show');
}
function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('hubModal').classList.remove('show');
}

function renderModalList() {
  const container = document.getElementById('modalPageList');
  container.innerHTML = '';
  pageList.forEach((p, idx) => {
    const row = document.createElement('div');
    row.className = 'hub-modal-item';

    const left = document.createElement('label');
    left.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;flex:1';
    
    const chk = document.createElement('input');
    chk.type = 'checkbox';
    chk.checked = p.visible;
    chk.onchange = () => {
      p.visible = chk.checked;
    };

    const text = document.createElement('span');
    text.textContent = `${p.name} (${p.path})`;

    left.appendChild(chk);
    left.appendChild(text);

    const delBtn = document.createElement('button');
    delBtn.style.cssText = 'border:none;background:none;color:#ef4444;cursor:pointer;font-size:12px';
    delBtn.textContent = '删除';
    delBtn.onclick = () => {
      pageList.splice(idx, 1);
      renderModalList();
    };

    row.appendChild(left);
    row.appendChild(delBtn);
    container.appendChild(row);
  });
}

function handleAddPage() {
  const name = document.getElementById('newPgName').value.trim();
  const path = document.getElementById('newPgPath').value.trim();
  if (!name || !path) {
    alert('请填写页面名称和文件路径');
    return;
  }
  pageList.push({
    id: path.replace('.html', ''),
    name: name,
    path: path,
    visible: true
  });
  document.getElementById('newPgName').value = '';
  document.getElementById('newPgPath').value = '';
  renderModalList();
}

  if (confirm('确认恢复默认 42 页面清单？')) {

}

function savePages() {
  localStorage.setItem(UNIFIED_STORAGE_KEY, JSON.stringify(pageList));

// 挂载 iframe 内部路由守护与拦截未勾选页面
function attachHubFrameNavigationGuard() {
  const frame = document.getElementById('hubFrame');
  if (!frame) return;
  try {
    const iframeWin = frame.contentWindow;
    const iframeDoc = frame.contentDocument;
    if (!iframeWin || !iframeDoc) return;

    // 1. 同步当前实际加载的页面
    const pathname = iframeWin.location.pathname || '';
    const rawFile = pathname.split(/[?#]/)[0].split('/').pop();
    if (rawFile && pageList) {
      const matched = pageList.find(p => p.path === rawFile || p.id === rawFile.replace(/\.html$/i, ''));
      if (matched) {
        if (!matched.visible) {
          const curPg = pageList.find(p => p.id === activePageId);
          if (curPg && curPg.visible && curPg.path !== rawFile) {
            showHubToast(`⚠️ 页面「${matched.name || rawFile}」未在「页面管理」中勾选，已拦截跳转`);
            frame.src = curPg.path;
            return;
          }
        } else if (activePageId !== matched.id) {
          activePageId = matched.id;
          window.location.hash = `page=${matched.id}`;
          renderTabs();
        }
      }
    }

    // 2. 捕获 iframe 内的所有点击
    iframeDoc.addEventListener('click', function(e) {
      const link = e.target.closest('a');
      if (link) {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript:') && !href.startsWith('tel:') && !href.startsWith('mailto:')) {
          const targetFile = href.split(/[?#]/)[0].split('/').pop();
          if (targetFile && targetFile.endsWith('.html')) {
            const matched = pageList.find(p => p.path === targetFile || p.id === targetFile.replace(/\.html$/i, ''));
            if (matched) {
              if (!matched.visible) {
                // 不在勾选页面中：无反应 + 轻提示！
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                showHubToast(`⚠️「${matched.name}」未在页面管理中勾选，暂不开放跳转`);
                return;
              } else {
                // 已勾选页面：联动切换
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                switchPage(matched.id);
                return;
              }
            }
          }
        }
      }

      const clickEl = e.target.closest('[onclick]');
      if (clickEl) {
        const onclickStr = clickEl.getAttribute('onclick') || '';
        const match = onclickStr.match(/(?:window\.)?location(?:\.href)?\s*=\s*['"`]([^'"`]+)['"`]/);
        if (match && match[1]) {
          const href = match[1];
          const targetFile = href.split(/[?#]/)[0].split('/').pop();
          if (targetFile && targetFile.endsWith('.html')) {
            const matched = pageList.find(p => p.path === targetFile || p.id === targetFile.replace(/\.html$/i, ''));
            if (matched) {
              if (!matched.visible) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                showHubToast(`⚠️「${matched.name}」未在页面管理中勾选，暂不开放跳转`);
                return;
              } else {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                switchPage(matched.id);
                return;
              }
            }
          }
        }
      }
    }, true);
  } catch(err) {
    console.warn('attachHubFrameNavigationGuard error:', err);
  }
}

function showHubToast(msg) {
  let toast = document.getElementById('hub-nav-guard-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'hub-nav-guard-toast';
    toast.style.cssText = `
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 999999;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  clearTimeout(window._hubToastTimer);
  window._hubToastTimer = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-6px)';
  }, 2200);
}

window.addEventListener('DOMContentLoaded', () => {
  init();
  const frame = document.getElementById('hubFrame');
  if (frame) {
    frame.addEventListener('load', attachHubFrameNavigationGuard);
  }
});
</script>
